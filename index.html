<style>
:root{--bg:#07030f;--panel:rgba(20,10,40,.72);--panel-brd:rgba(150,90,255,.25);--cyan:#00ffc8;--purple:#b967ff;--magenta:#ff2e88;--text:#efe9fb;--dim:#9d8fc0;--ok:#3dffa8;--font-display:"Orbitron",sans-serif;--font-body:"Space Grotesk",sans-serif;--font-mono:"JetBrains Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;touch-action:manipulation;background-image:radial-gradient(1200px 600px at 80% -10%,rgba(120,40,200,.22),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(0,255,200,.08),transparent 60%)}
header{padding:18px 16px 10px;text-align:center}
.logo{font-family:var(--font-display);font-weight:900;font-size:clamp(28px,6vw,48px);letter-spacing:.14em;background:linear-gradient(90deg,var(--cyan),var(--purple),var(--magenta));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(185,103,255,.4))}
.tagline{color:var(--dim);font-size:10px;letter-spacing:.3em;text-transform:uppercase;margin-top:4px}
.transport{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
#playBtn{width:56px;height:56px;border-radius:50%;border:2px solid var(--cyan);background:radial-gradient(circle at 35% 30%,rgba(0,255,200,.25),rgba(0,255,200,.05));color:var(--cyan);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
#playBtn.playing{border-color:var(--magenta);color:var(--magenta);animation:beat .42s infinite}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.06)}}
.meta{flex:1;min-width:100px}
.meta .name{font-family:var(--font-display);font-weight:700;font-size:13px}
.meta .sub{color:var(--dim);font-size:9px;font-family:var(--font-mono)}
.abToggle{display:flex;border:1px solid var(--panel-brd);border-radius:8px;overflow:hidden}
.abToggle button{padding:8px 14px;background:transparent;border:none;color:var(--dim);font-family:var(--font-display);font-weight:700;font-size:11px;cursor:pointer}
.abToggle button.on[data-v="A"]{background:rgba(0,255,200,.15);color:var(--cyan)}
.abToggle button.on[data-v="B"]{background:rgba(255,46,136,.15);color:var(--magenta)}
#stateBar{font-family:var(--font-mono);font-size:10px;color:var(--dim);padding:6px 16px;display:flex;align-items:center;gap:8px}
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
#energyBar{flex:1;height:4px;background:rgba(150,90,255,.15);border-radius:2px;overflow:hidden}
#energyFill{height:100%;width:50%;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:2px;transition:width .3s}
#xyPad{height:150px;margin:6px 16px;border-radius:12px;position:relative;cursor:crosshair;background:linear-gradient(135deg,rgba(0,255,200,.04),rgba(185,103,255,.08),rgba(255,46,136,.04));border:1px solid var(--panel-brd);touch-action:none}
#xyDot{width:22px;height:22px;border-radius:50%;position:absolute;background:radial-gradient(circle,var(--cyan),rgba(0,255,200,.3));box-shadow:0 0 14px var(--cyan);transform:translate(-50%,-50%);pointer-events:none;left:50%;top:50%}
.xyLabel{position:absolute;font-family:var(--font-mono);font-size:8px;color:var(--dim);pointer-events:none}
.xyX{bottom:5px;right:8px}.xyY{top:5px;left:8px}
#xyInfo{font-family:var(--font-mono);font-size:9px;color:var(--cyan);text-align:center;padding:2px}
.tracks{display:flex;gap:6px;padding:6px 16px}
.trackBtn{flex:1;padding:10px 4px;border-radius:8px;border:1px solid var(--panel-brd);background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--font-mono);font-size:10px;text-align:center;cursor:pointer;transition:all .15s}
.trackBtn.on{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,200,.08)}
.trackBtn.muted{border-color:var(--magenta);color:var(--magenta);opacity:.5}
.presets{display:flex;gap:8px;padding:6px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.presetCard{min-width:130px;border:1px solid var(--panel-brd);border-radius:10px;padding:10px;cursor:pointer;background:rgba(12,6,28,.5);flex-shrink:0;transition:all .15s}
.presetCard.sel{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,255,200,.15)}
.presetCard .pname{font-family:var(--font-display);font-weight:700;font-size:11px}
.presetCard .ptag{font-family:var(--font-mono);font-size:8px;color:var(--magenta)}
.presetCard .pbpm{font-family:var(--font-mono);font-size:8px;color:var(--cyan)}
.steps{display:flex;gap:4px;padding:6px 16px}
.stepDot{flex:1;height:12px;border-radius:4px;background:rgba(150,90,255,.12);transition:all .08s}
.stepDot.kick{background:rgba(255,46,136,.3)}
.stepDot.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan);transform:scaleY(1.4)}
#scope{width:calc(100% - 32px);height:70px;margin:6px 16px;display:block;border-radius:8px;background:rgba(5,2,12,.7);border:1px solid rgba(150,90,255,.15)}
.pads{display:flex;gap:4px;flex-wrap:wrap;padding:6px 16px;justify-content:center}
.pad{width:calc((100% - 60px)/8);min-width:36px;height:50px;border-radius:8px;border:1px solid var(--panel-brd);background:linear-gradient(180deg,#f5f0ff,#cfc4e8);cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-family:var(--font-mono);font-size:9px;color:#5a4a80;text-transform:uppercase;transition:all .08s}
.pad.black{background:linear-gradient(180deg,#2a1b4a,#160b30);color:var(--purple);border-color:rgba(185,103,255,.4)}
.pad:active,.pad.hit{transform:translateY(2px);box-shadow:0 0 14px rgba(0,255,200,.6);border-color:var(--cyan)}
.fxGrid{display:flex;gap:6px;padding:6px 16px;flex-wrap:wrap}
.fxBtn{flex:1;min-width:55px;padding:10px 4px;border-radius:8px;border:1px solid var(--panel-brd);background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--font-mono);font-size:10px;text-align:center;cursor:pointer;transition:all .15s}
.fxBtn.on{border-color:var(--magenta);color:var(--magenta);background:rgba(255,46,136,.1)}
.fxSliders{padding:4px 16px 12px}
.fxSl{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.fxSl label{font-family:var(--font-mono);font-size:9px;color:var(--dim);width:36px}
.fxSl input{flex:1;accent-color:var(--purple);height:22px}
.fxSl b{font-family:var(--font-mono);font-size:9px;color:var(--cyan);width:28px;text-align:right}
.volWrap{display:flex;align-items:center;gap:8px;padding:4px 16px}
.volWrap span{font-family:var(--font-mono);font-size:9px;color:var(--dim)}
.volWrap input{flex:1;accent-color:var(--purple)}
#toast{position:fixed;bottom:16px;left:50%;transform:translate(-50%,80px);background:rgba(10,40,30,.95);border:1px solid var(--ok);color:var(--ok);padding:10px 20px;border-radius:999px;font-family:var(--font-mono);font-size:11px;transition:transform .35s;z-index:99}
#toast.show{transform:translate(-50%,0)}
footer{text-align:center;padding:16px;color:var(--dim);font-size:10px;font-family:var(--font-mono)}
/* PATTERN EDITOR */
.patternGrid{padding:4px 14px}
.patternRow{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.patternLabel{font-family:var(--font-mono);font-size:8px;color:var(--dim);width:28px;flex-shrink:0}
.pStep{flex:1;height:16px;border-radius:3px;background:rgba(150,90,255,.1);cursor:pointer;transition:all .08s;border:1px solid transparent}
.pStep.on{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 6px rgba(0,255,200,.4)}

.bpmWrap{display:flex;align-items:center;gap:8px;padding:3px 14px}
.bpmWrap span{font-family:var(--font-mono);font-size:9px;color:var(--dim)}
.bpmWrap input{flex:1;accent-color:var(--magenta)}
.bpmWrap b{font-family:var(--font-mono);font-size:10px;color:var(--magenta);width:30px;text-align:right}

#stateFlash.active{animation:stateFlash .4s ease-out}
.arpRow{display:flex;gap:5px;padding:4px 14px;align-items:center}
.arpBtn{flex:1;padding:8px 4px;border-radius:8px;border:1px solid var(--panel-brd);background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--font-mono);font-size:9px;text-align:center;cursor:pointer}

.stateRow{display:flex;gap:5px;padding:4px 14px}
.stateBtn{flex:1;padding:8px 2px;border-radius:8px;border:1px solid var(--panel-brd);background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--font-mono);font-size:8px;text-align:center;cursor:pointer;transition:all .15s}
.stateBtn.active{color:#fff;font-weight:700}
.randBtn{padding:8px 14px;border-radius:8px;border:1px solid var(--purple);background:rgba(185,103,255,.1);color:var(--purple);font-family:var(--font-mono);font-size:10px;cursor:pointer;margin:4px 14px;display:inline-block}
.randBtn:active{transform:scale(.95);background:rgba(185,103,255,.25)}
.bankRow{display:flex;gap:5px;padding:3px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.bankChip{min-width:65px;padding:6px 6px;border-radius:6px;border:1px solid var(--panel-brd);background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--font-mono);font-size:8px;text-align:center;cursor:pointer;flex-shrink:0}
.bankChip.on{border-color:var(--purple);color:var(--purple);background:rgba(185,103,255,.1)}
.bankLabel{font-family:var(--font-mono);font-size:8px;color:var(--dim);padding:3px 14px 0;letter-spacing:.15em}

for(var i=0;i<bars;i++){var val=freqData[Math.floor(i*freqData.length/bars/1.6)]/255;var h=Math.max(2,val*H*.92);sctx.globalAlpha=.35+val*.65;sctx.fillStyle=_barColors[i]||"#0fc";sctx.fillRect(i*bw+1,H-h,bw-2,h);}

}

_prevDot=on;
}

var xyPad=$("xyPad"),xyDot=$("xyDot"),xyActive=false;

var iv=ARP_INTERVALS[arpState.mode];var n=root+iv[arpState.idx%iv.length];arpState.idx++;return n;}

$("randBtn").addEventListener("click",function(){var p=activePreset();if(!livePatterns)initLivePatterns();var sc=[0,3,5,7,10,12,15];
for(var i=0;i<16;i++){if(i%4===0){livePatterns.bass[i]=null;}else{livePatterns.bass[i]=Math.random()<.4?sc[Math.floor(Math.random()*sc.length)]:null;}}
for(var j=0;j<16;j++){livePatterns.lead[j]=Math.random()<.25?sc[Math.floor(Math.random()*sc.length)]+12:null;}
for(var k=0;k<16;k++){livePatterns.hat[k]=Math.random()<.35?1:0;}

function playBankKick(t){
var patch=SOUND_BANK.patches[activeBank.kick];
if(!patch||trackMute.kick||_activeVoices>=MAX_VOICES)return;
_activeVoices+=patch.layers.length;var c=audioCtx;
var energyBoost=.6+mind.energy*.4;
patch.layers.forEach(function(layer){
if(layer.noise){var s=c.createBufferSource();s.buffer=noiseBuf;var f=c.createBiquadFilter();f.type="highpass";f.frequency.value=layer.hp;var g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(layer.g*energyBoost,t+.001);g.gain.exponentialRampToValueAtTime(.001,t+layer.dec);s.connect(f);f.connect(g);g.connect(masterGain);s.start(t);s.stop(t+layer.dec+.02);s.onended=function(){s.disconnect();f.disconnect();g.disconnect();_activeVoices--;};
var s2=c.createBufferSource();s2.buffer=noiseBuf;
var f2=c.createBiquadFilter();f2.type="highpass";f2.frequency.value=patch.filter.freq*1.4;
var g2=c.createGain();g2.gain.setValueAtTime(0,t);
g2.gain.linearRampToValueAtTime(lvl*.4,t+.001);
g2.gain.exponentialRampToValueAtTime(.001,t+patch.dec*.6);
s2.connect(f2);f2.connect(g2);g2.connect(masterGain);
s2.start(t);s2.stop(t+patch.dec*.6+.02);
s2.onended=function(){s2.disconnect();f2.disconnect();g2.disconnect();_activeVoices--;};}
else{var o=c.createOscillator();o.type=layer.wave;o.frequency.setValueAtTime(layer.f0,t);o.frequency.exponentialRampToValueAtTime(layer.f1,t+layer.ft);var g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(layer.g*energyBoost,t+.002);g.gain.exponentialRampToValueAtTime(.001,t+layer.dec);o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+layer.dec+.02);o.onended=function(){o.disconnect();g.disconnect();_activeVoices--;};}});
pump(t);}
function playBankBass(t,freq){
var patch=SOUND_BANK.patches[activeBank.bass];
if(!patch||trackMute.bass||_activeVoices>=MAX_VOICES)return;
_activeVoices+=2;var c=audioCtx;var dur=(60/(bpmOverride||activePreset().bpm))*.25*.65;
var o=c.createOscillator();o.type=patch.wave;o.frequency.value=freq;
var f=c.createBiquadFilter();f.type=patch.filter.type;f.Q.value=patch.filter.q;
var wb=Math.min(fxState.cutoff,patch.filter.freq*1.2*(.8+mind.energy*.4));
f.frequency.setValueAtTime(wb,t);
if(window._wahLfoGain&&fxState.wah){try{window._wahLfoGain.connect(f.frequency);}catch(e){}}
f.frequency.exponentialRampToValueAtTime(Math.max(100,patch.filter.freq*.25),t+dur*patch.env.hold);
var g=c.createGain();var vel=.75+Math.random()*.15;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+patch.env.a);g.gain.setValueAtTime(vel,t+dur*patch.env.hold);g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(f);f.connect(g);g.connect(duckBus);
if(patch.sub){var so=c.createOscillator();so.type=patch.sub.wave;so.frequency.value=freq*Math.pow(2,patch.sub.oct);var sg=c.createGain();sg.gain.setValueAtTime(0,t);sg.gain.linearRampToValueAtTime(patch.sub.g,t+.003);sg.gain.exponentialRampToValueAtTime(.001,t+dur*.8);so.connect(sg);sg.connect(duckBus);so.start(t);so.stop(t+dur+.02);so.onended=function(){so.disconnect();sg.disconnect();};}
o.start(t);o.stop(t+dur+.02);
o.onended=function(){o.disconnect();f.disconnect();g.disconnect();_activeVoices-=2;};}
function playBankLead(t,freq,accent){
var patch=SOUND_BANK.patches[activeBank.lead];
if(!patch||trackMute.lead||_activeVoices>=MAX_VOICES)return;
_activeVoices+=3;var c=audioCtx;var dur=accent?.24:.16;
var pan=c.createStereoPanner?c.createStereoPanner():null;
if(pan)pan.pan.value=(Math.random()*2-1)*(accent?.6:.35);
var o=c.createOscillator();o.type=patch.wave;o.frequency.value=freq;
var o2=c.createOscillator();o2.type=patch.wave;o2.frequency.value=freq;o2.detune.value=patch.detune||5;
var o3=c.createOscillator();o3.type="sine";o3.frequency.value=freq*2;
var o3g=c.createGain();o3g.gain.value=accent?.12:.06;
o3.connect(o3g);
var f=c.createBiquadFilter();f.type=patch.filter.type;f.Q.value=accent?Math.min(18,patch.filter.q+5):patch.filter.q;
f.frequency.setValueAtTime(Math.min(fxState.cutoff*1.5,patch.filter.freq*(accent?1.25:1)),t);
f.frequency.exponentialRampToValueAtTime(240,t+dur*.8);
var g=c.createGain();var peak=(activeParams().leadLvl||.5)*(accent?1:.65)*(.7+mind.energy*.3);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+patch.env.a);g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(f);o2.connect(f);f.connect(g);
if(pan){g.connect(pan);pan.connect(masterGain);}else{g.connect(masterGain);}
if(patch.sends){if(patch.sends.delay&&ppIn)g.connect(ppIn);if(patch.sends.reverb&&window._revIn)g.connect(window._revIn);}
else{if(ppIn)g.connect(ppIn);if(window._revIn)g.connect(window._revIn);}
o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02);
o.onended=function(){o.disconnect();o2.disconnect();f.disconnect();g.disconnect();if(pan)pan.disconnect();_activeVoices-=2;};}
function playBankHat(t,open){
var pk=open?"hat_open":activeBank.hat;var patch=SOUND_BANK.patches[pk];
if(!patch||trackMute.hat||_activeVoices>=MAX_VOICES)return;
_activeVoices+=2;var c=audioCtx;var s=c.createBufferSource();s.buffer=noiseBuf;
var f=c.createBiquadFilter();f.type=patch.filter.type;f.frequency.value=patch.filter.freq;
var lvl=activeParams().hatLvl||.1;
var g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(lvl,t+.001);g.gain.exponentialRampToValueAtTime(.001,t+patch.dec);
s.connect(f);f.connect(g);g.connect(masterGain);s.start(t);s.stop(t+patch.dec+.02);
s.onended=function(){s.disconnect();f.disconnect();g.disconnect();_activeVoices--;};}

el.appendChild(chip);});});}

function buildPatternGrid(){

var tracks=["kick","bass","lead","hat"];var labels=["KCK","BSS","LED","HAT"];
tracks.forEach(function(tr,ti){
var row=document.createElement("div");row.className="patternRow";

for(var s=0;s<16;s++){var cell=document.createElement("div");cell.className="pStep";cell.dataset.track=tr;cell.dataset.step=s;

grid.appendChild(row);});

function togglePatternStep(tr,step){
var p=activePreset();if(!livePatterns)initLivePatterns();
if(tr==="kick"){if(!livePatterns.kick)livePatterns.kick=p.patterns.kick.slice();livePatterns.kick[step]=livePatterns.kick[step]?0:1;}
else if(tr==="hat"){livePatterns.hat[step]=livePatterns.hat[step]?0:1;}
else if(tr==="bass"){livePatterns.bass[step]=(livePatterns.bass[step]===null)?0:null;}
else{livePatterns.lead[step]=(livePatterns.lead[step]===null)?0:null;}
if(navigator.vibrate)navigator.vibrate(10);refreshPatternGrid();}
function refreshPatternGrid(){
var p=activePreset();var lp=livePatterns||p.patterns;
var cells=document.querySelectorAll(".pStep");
cells.forEach(function(cell){var tr=cell.dataset.track;var s=parseInt(cell.dataset.step);var val;
if(tr==="kick"){val=(lp.kick||p.patterns.kick)[s];}else{val=lp[tr]?lp[tr][s]:p.patterns[tr][s];}
var isOn=(val!==null&&val!==undefined&&val!==0);
cell.classList.toggle("on",isOn);cell.classList.toggle("kick-on",tr==="kick"&&isOn);});}

var nb=parseInt(this.value);$("vBpm").textContent=nb;bpmOverride=nb;
if(window._gateLfo)window._gateLfo.frequency.value=nb/60*2;
if(window._wahLfo)window._wahLfo.frequency.value=nb/60/2;});

mind.transition=function(){var old=this.state;_origTrans();
if(this.state!==old){var fl=$("stateFlash");
if(fl){var st=STATES[this.state];fl.style.background="radial-gradient(circle,"+st.color+"44,transparent 70%)";
fl.classList.remove("active");void fl.offsetWidth;fl.classList.add("active");}
if(navigator.vibrate)navigator.vibrate(30);}};
