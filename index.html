<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSY6 MAX — Professional Psytrance Workstation</title>
<style>
:root{
  --bg:#070312; --panel:rgba(18,9,36,.82); --border:rgba(150,90,255,.25);
  --cyan:#00ffc8; --purple:#b967ff; --magenta:#ff2e88; --text:#efe9fb;
  --dim:#9d8fc0; --ok:#3dffa8; --warn:#ffb347; --err:#ff4d6d;
  --lcd-bg:#04140c; --lcd-fg:#49ffa4;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--text); min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:
    radial-gradient(1200px 600px at 80% -10%, rgba(120,40,200,.22), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(0,255,200,.07), transparent 60%);
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.topbar{text-align:center;padding:38px 20px 20px}
.logo{font-size:44px;font-weight:900;letter-spacing:.12em;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(185,103,255,.45))}
.logo span{font-size:20px;letter-spacing:.35em;display:block;color:var(--dim);
  -webkit-text-fill-color:var(--dim);filter:none;margin-top:4px}
.subtitle{color:var(--dim);margin-top:8px;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
.device{max-width:900px;margin:0 auto;padding:0 16px 30px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;
  box-shadow:0 10px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.04)}
.panel h2{font-size:13px;letter-spacing:.1em;margin-bottom:12px;color:var(--cyan);text-transform:uppercase}
.panel h2 .small{color:var(--dim);font-size:11px;text-transform:none;letter-spacing:0}
.top-row{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.lcd{flex:1;min-width:260px;background:var(--lcd-bg);border:1px solid #0f3d26;border-radius:10px;
  padding:12px 14px;box-shadow:inset 0 0 22px rgba(0,60,30,.55)}
.lcd-line{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--lcd-fg);
  text-shadow:0 0 8px rgba(73,255,164,.5);font-size:15px;letter-spacing:.12em}
.lcd-line.big{font-size:20px;font-weight:700}
.lcd-steps{display:flex;gap:4px;margin-top:10px}
.ls{flex:1;height:6px;border-radius:3px;background:#0b2c1b}
.ls.on{background:var(--lcd-fg);box-shadow:0 0 8px var(--lcd-fg)}
.transport{display:flex;flex-direction:column;gap:8px;justify-content:center}
.play-btn{font-size:17px;padding:14px 34px;border-radius:999px;cursor:pointer;font-weight:800;
  letter-spacing:.1em;background:linear-gradient(90deg,var(--cyan),var(--purple));
  color:#0a0518;border:none;box-shadow:0 4px 18px rgba(0,255,200,.3)}
.play-btn.playing{background:linear-gradient(90deg,var(--magenta),var(--purple));
  box-shadow:0 4px 18px rgba(255,46,136,.35)}
.util-btn{padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:12px;
  letter-spacing:.08em;background:#0d0620;color:var(--dim);border:1px solid var(--border)}
.util-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.diag{font-size:11px;display:flex;flex-direction:column;justify-content:center;gap:4px;color:var(--dim)}
.diag .ok{color:var(--ok)} .diag .err{color:var(--err)}
.timeline{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:640px;margin-top:2px}
.tl-sec{height:18px;font-size:9px;line-height:18px;text-align:center;color:#0a0518;cursor:pointer;
  border-radius:3px;background:var(--purple);overflow:hidden;padding:0 3px;font-weight:700;
  font-family:ui-monospace,Menlo,monospace}
.tl-sec:hover{background:var(--magenta)}
.tl-sec.cur{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.knobs-row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.knob{display:flex;flex-direction:column;align-items:center;gap:5px;user-select:none;touch-action:none}
.knob-dial{position:relative;width:56px;height:56px;border-radius:50%;cursor:ns-resize;
  background:radial-gradient(circle at 35% 30%, #3a2b5e, #171028);
  border:1px solid var(--border);box-shadow:0 4px 10px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.08)}
.knob-ind{position:absolute;left:50%;top:5px;width:3px;height:15px;margin-left:-1.5px;
  background:var(--cyan);border-radius:2px;box-shadow:0 0 6px var(--cyan)}
.knob-name{font-size:10px;letter-spacing:.14em;color:var(--dim)}
.knob-val{font-size:11px;color:var(--cyan);font-family:ui-monospace,Menlo,monospace}
.seq-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.mute{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);cursor:pointer;
  background:#0d0620;color:var(--dim);font-weight:700;font-size:11px;flex:none}
.mute.muted{background:var(--err);color:#160308;border-color:var(--err)}
.part-label{width:48px;flex:none;font-size:11px;font-weight:800;letter-spacing:.1em}
.steps{display:flex;gap:4px;flex:1}
.step{flex:1;height:26px;border-radius:5px;border:1px solid rgba(150,90,255,.3);cursor:pointer;
  background:#120a24;min-width:12px;padding:0}
.step.q{margin-left:9px}
.step.cur{outline:2px solid rgba(255,255,255,.85);outline-offset:-1px}
.pads-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pad{flex:1;min-width:52px;height:52px;border-radius:10px;border:1px solid var(--border);cursor:pointer;
  background:linear-gradient(180deg,#1c1136,#0d0620);color:var(--purple);
  font-weight:800;font-size:15px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pad.hit{background:linear-gradient(180deg,var(--purple),#5d2ba0);color:#0a0518;
  box-shadow:0 0 16px rgba(185,103,255,.7)}
#viz{width:100%;height:90px;border-radius:10px;border:1px solid var(--border);background:#070312;display:block}
.status{min-height:18px;font-size:12px;margin-top:8px}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.error{color:var(--err)}
.status.dim{color:var(--dim)}
.hint{color:var(--dim);font-size:11px;margin-top:8px}
.footer{text-align:center;padding:20px;color:var(--dim);font-size:11px}
.footer a{color:var(--purple);text-decoration:none}
@media(max-width:640px){ .part-label{width:38px;font-size:9px} .step{height:22px} }

@media(max-width:600px){
.topbar{padding:16px 10px 10px}
.logo{font-size:22px;letter-spacing:.08em}
.subtitle{font-size:9px;letter-spacing:.15em}
.device{padding:0 6px 14px;gap:8px}
.panel{padding:10px;border-radius:8px}
.play-btn{padding:10px 18px;font-size:12px}
.util-btn{padding:7px 10px;font-size:9px}
.lcd{font-size:10px;padding:8px 10px}
.knob{width:48px;height:48px}
.knob-val{font-size:7px}
.knob-lab{font-size:7px}
.seq-grid{gap:2px}
.seq-cell{height:18px;border-radius:3px}
.pads-row{gap:4px}
.pad{height:42px;font-size:9px;border-radius:6px}
.hint{font-size:9px}
.status{font-size:9px}
}

.xyWrap{padding:4px 14px}
.xyPad{height:100px;border-radius:10px;position:relative;cursor:crosshair;
background:linear-gradient(135deg,rgba(0,255,200,.03),rgba(185,103,255,.06),rgba(255,46,136,.03));
border:1px solid var(--border);touch-action:none;margin:4px 0}
.xyDot{width:18px;height:18px;border-radius:50%;position:absolute;
background:radial-gradient(circle,var(--cyan),rgba(0,255,200,.3));
box-shadow:0 0 10px var(--cyan);transform:translate(-50%,-50%);pointer-events:none;left:50%;top:50%}
.xyInfo{font-family:var(--mono);font-size:8px;color:var(--dim);text-align:center;padding:2px}

.secProg{display:flex;align-items:center;gap:6px;padding:4px 14px}
.secProg .track{flex:1;height:3px;background:rgba(150,90,255,.1);border-radius:2px;overflow:hidden}
.secProg .fill{height:100%;width:0%;background:var(--magenta);border-radius:2px;transition:width .2s}
.secProg .name{font-family:var(--mono);font-size:8px;color:var(--dim);min-width:50px}

.energyDot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}

/* ═══ REC + FX ═══ */
.recBtn{background:var(--panel);border:1px solid var(--border);color:var(--dim);
font-family:var(--mono);font-size:10px;padding:6px 12px;border-radius:6px;cursor:pointer;
transition:all .15s}
.recBtn.recording{color:#ff2e63;border-color:#ff2e63;animation:recPulse 1s infinite}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.5}}
.fxRow{display:flex;gap:6px;padding:6px 14px;flex-wrap:wrap}
.fxBtn{flex:1;min-width:55px;padding:8px 4px;border-radius:8px;border:1px solid var(--border);
background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--mono);font-size:9px;
text-align:center;cursor:pointer;transition:all .15s}
.fxBtn.on{border-color:var(--magenta);color:var(--magenta);background:rgba(255,46,136,.1)}
.fxBtn:active{transform:scale(.95)}

/* ═══ SPECTRUM ═══ */
.specWrap{padding:4px 14px}
#specCanvas{width:100%;height:60px;display:block;border-radius:8px;
background:rgba(5,2,12,.5);border:1px solid var(--border)}

/* ═══ PRESET BANK ═══ */
.bankRow{display:flex;gap:5px;padding:4px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.bankChip{min-width:60px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);
background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--mono);font-size:8px;
text-align:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.bankChip:hover{border-color:var(--purple);color:var(--purple)}
.bankChip:active{transform:scale(.95)}
.bankChip.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,200,.08)}

/* ═══ BASS/SWING CONTROLS ═══ */
.styleRow{display:flex;gap:5px;padding:4px 14px;flex-wrap:wrap;align-items:center}
.styleRow label{font-family:var(--mono);font-size:8px;color:var(--dim);letter-spacing:.1em;min-width:35px}
.styleChip{padding:5px 8px;border-radius:5px;border:1px solid var(--border);
background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--mono);font-size:8px;
cursor:pointer;transition:all .15s}
.styleChip.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,200,.08)}
.styleChip:active{transform:scale(.95)}

/* ═══ SECTION JUMP ═══ */
.jumpRow{display:flex;gap:4px;padding:4px 14px;flex-wrap:wrap}
.jumpBtn{padding:5px 8px;border-radius:5px;border:1px solid var(--border);
background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--mono);font-size:8px;
cursor:pointer;transition:all .15s}
.jumpBtn.active{border-color:var(--magenta);color:var(--magenta);background:rgba(255,46,136,.1)}
.jumpBtn:active{transform:scale(.95)}

/* ═══ BPM SLIDER ═══ */
.bpmRow{display:flex;align-items:center;gap:8px;padding:4px 14px}
.bpmRow label{font-family:var(--mono);font-size:9px;color:var(--dim);min-width:30px}
.bpmRow input{flex:1;accent-color:var(--cyan);height:20px}
.bpmRow b{font-family:var(--mono);font-size:10px;color:var(--cyan);min-width:35px;text-align:right}

/* ═══ BEAT INDICATOR ═══ */
.beatDots{display:flex;gap:6px;justify-content:center;padding:6px 14px}
.beatDot{width:12px;height:12px;border-radius:50%;background:rgba(150,90,255,.15);transition:all .08s}
.beatDot.on{background:var(--cyan);box-shadow:0 0 10px var(--cyan);transform:scale(1.3)}
.beatDot.kick{background:var(--magenta);box-shadow:0 0 10px var(--magenta)}

/* ═══ PATTERN LIBRARY ═══ */
.libRow{display:flex;gap:4px;padding:4px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.libChip{min-width:55px;padding:5px 7px;border-radius:5px;border:1px solid var(--border);
background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--mono);font-size:8px;
text-align:center;cursor:pointer;flex-shrink:0;transition:all .15s}
.libChip:hover{border-color:var(--purple);color:var(--purple)}
.libChip:active{transform:scale(.95)}

/* ═══ SOUND BANK ═══ */
.sndRow{display:flex;gap:4px;padding:4px 14px;flex-wrap:wrap}
.sndChip{padding:5px 7px;border-radius:5px;border:1px solid var(--border);
background:rgba(12,6,28,.6);color:var(--dim);font-family:var(--mono);font-size:8px;
cursor:pointer;transition:all .15s}
.sndChip.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,255,200,.08)}
.sndChip:active{transform:scale(.95)}

/* ═══ MACRO BUTTONS ═══ */
.macro-row{margin-top:8px}
.macro-btn{flex:1;padding:12px 8px;font-size:11px;font-weight:bold;border-radius:6px;cursor:pointer;transition:all .15s}
.macro-btn:active{transform:scale(0.95)}
#macroSpaceBtn{background:rgba(0,170,255,.15);border-color:#00aaff;color:#00aaff}
#macroEnergyBtn{background:rgba(255,102,0,.15);border-color:#ff6600;color:#ff6600}
#macroTensionBtn{background:rgba(255,46,136,.15);border-color:#ff2e88;color:#ff2e88}

/* ═══ PSYCHEDELIC DESIGN ═══ */
@keyframes psychedelic-bg{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}
@keyframes neon-pulse{
  0%,100%{opacity:1;filter:brightness(1)}
  50%{opacity:.85;filter:brightness(1.3)}
}
@keyframes trippy-rotate{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}
@keyframes color-shift{
  0%{filter:hue-rotate(0deg)}
  100%{filter:hue-rotate(360deg)}
}
body{
  background:linear-gradient(-45deg,#0a0015,#1a0030,#000a20,#001a10,#0a0015);
  background-size:400% 400%;
  animation:psychedelic-bg 20s ease infinite;
  color:#e0e0ff;
  font-family:'Courier New',monospace;
  overflow-x:hidden;
}
/* Neon glow on panels */
.panel{
  background:rgba(10,0,30,.7);
  border:1px solid rgba(185,103,255,.3);
  box-shadow:0 0 20px rgba(185,103,255,.15),inset 0 0 30px rgba(0,255,200,.05);
  backdrop-filter:blur(10px);
  border-radius:12px;
}
/* Psychedelic header */
.header{
  background:linear-gradient(90deg,rgba(255,46,136,.1),rgba(185,103,255,.1),rgba(0,255,200,.1));
  border-bottom:2px solid;
  border-image:linear-gradient(90deg,#ff2e88,#b967ff,#00ffc8) 1;
  text-shadow:0 0 10px rgba(255,46,136,.5);
}
/* Neon buttons */
button{
  background:rgba(20,0,40,.8);
  border:1px solid rgba(185,103,255,.4);
  color:#e0e0ff;
  box-shadow:0 0 10px rgba(185,103,255,.2);
  transition:all .2s;
}
button:hover,button:active{
  box-shadow:0 0 20px rgba(255,46,136,.4),0 0 40px rgba(185,103,255,.2);
  border-color:#ff2e88;
  transform:scale(1.05);
}
/* Play button - special psychedelic */
.play-btn{
  background:linear-gradient(135deg,rgba(255,46,136,.3),rgba(185,103,255,.3));
  border:2px solid #ff2e88;
  box-shadow:0 0 20px rgba(255,46,136,.4);
  animation:neon-pulse 2s ease-in-out infinite;
}
/* LCD - psychedelic display */
.lcd{
  background:linear-gradient(180deg,rgba(0,20,0,.9),rgba(0,40,20,.9));
  border:2px solid #00ff88;
  box-shadow:0 0 15px rgba(0,255,136,.3),inset 0 0 20px rgba(0,255,136,.1);
  color:#00ff88;
  text-shadow:0 0 5px #00ff88;
}
/* Knobs - psychedelic */
.knob{
  background:radial-gradient(circle,rgba(185,103,255,.2),rgba(20,0,40,.8));
  border:2px solid rgba(185,103,255,.5);
  box-shadow:0 0 10px rgba(185,103,255,.3);
}
.knob:hover{
  box-shadow:0 0 20px rgba(255,46,136,.4);
  border-color:#ff2e88;
}
/* XY Pad - psychedelic */
.xyPad{
  background:radial-gradient(circle at 50% 50%,rgba(0,255,200,.1),rgba(185,103,255,.1),rgba(10,0,30,.9));
  border:2px solid rgba(0,255,200,.4);
  box-shadow:0 0 30px rgba(0,255,200,.2),inset 0 0 50px rgba(185,103,255,.1);
}
.xyDot{
  background:radial-gradient(circle,#00ffc8,#b967ff);
  box-shadow:0 0 20px #00ffc8,0 0 40px rgba(185,103,255,.5);
}
/* Pads - psychedelic */
.pad{
  background:linear-gradient(135deg,rgba(255,46,136,.2),rgba(185,103,255,.2));
  border:1px solid rgba(255,46,136,.4);
  box-shadow:0 0 10px rgba(255,46,136,.2);
}
.pad:active{
  background:linear-gradient(135deg,rgba(255,46,136,.5),rgba(185,103,255,.5));
  box-shadow:0 0 30px rgba(255,46,136,.6);
  transform:scale(.95);
}
/* Sequencer - psychedelic */
.seq-cell{
  background:rgba(20,0,40,.6);
  border:1px solid rgba(185,103,255,.2);
}
.seq-cell.on{
  background:linear-gradient(135deg,#ff2e88,#b967ff);
  box-shadow:0 0 10px rgba(255,46,136,.5);
}
/* Beat dots - psychedelic */
.beat-dot{
  background:rgba(20,0,40,.6);
  border:1px solid rgba(185,103,255,.3);
}
.beat-dot.on{
  background:radial-gradient(circle,#00ffc8,#b967ff);
  box-shadow:0 0 15px #00ffc8;
}
/* FX buttons - psychedelic */
.fx-btn{
  background:rgba(20,0,40,.6);
  border:1px solid rgba(185,103,255,.3);
}
.fx-btn.on{
  background:linear-gradient(135deg,rgba(0,255,200,.3),rgba(185,103,255,.3));
  border-color:#00ffc8;
  box-shadow:0 0 15px rgba(0,255,200,.4);
}
/* Spectrum - psychedelic */
#specCanvas{
  background:rgba(0,0,0,.5);
  border:1px solid rgba(185,103,255,.2);
}
/* Timeline - psychedelic */
.tl-sec{
  background:rgba(20,0,40,.6);
  border:1px solid rgba(185,103,255,.2);
}
.tl-sec.current{
  background:linear-gradient(90deg,rgba(255,46,136,.3),rgba(185,103,255,.3));
  border-color:#ff2e88;
  box-shadow:0 0 10px rgba(255,46,136,.3);
}
/* Scrollbar - psychedelic */
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:rgba(10,0,30,.5)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff2e88,#b967ff);border-radius:4px}
/* Status - psychedelic */
#status{
  color:#00ffc8;
  text-shadow:0 0 5px rgba(0,255,200,.5);
}

/* ═══ ADVANCED PSYCHEDELIC DESIGN ═══ */

/* Glassmorphism panels */
.panel{
  background:rgba(10,0,30,.6);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  box-shadow:
    0 8px 32px rgba(0,0,0,.4),
    0 0 20px rgba(185,103,255,.1),
    inset 0 1px 0 rgba(255,255,255,.05);
  position:relative;
  overflow:hidden;
}
.panel::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:conic-gradient(from 0deg,transparent,rgba(255,46,136,.03),transparent,rgba(0,255,200,.03),transparent);
  animation:trippy-rotate 15s linear infinite;
  pointer-events:none;
}

/* Animated gradient border */
@keyframes border-glow{
  0%,100%{border-color:rgba(255,46,136,.4)}
  33%{border-color:rgba(185,103,255,.4)}
  66%{border-color:rgba(0,255,200,.4)}
}
.panel{animation:border-glow 6s ease infinite}

/* Refined typography */
body{
  font-family:'Courier New',monospace;
  letter-spacing:0.5px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}

/* Touch-friendly buttons */
button{
  min-height:44px;
  min-width:44px;
  padding:12px 16px;
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  border-radius:10px;
  cursor:pointer;
  transition:all .2s cubic-bezier(.4,0,.2,1);
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

/* Play button - hero */
.play-btn{
  background:linear-gradient(135deg,#ff2e88,#b967ff,#00ffc8);
  background-size:200% 200%;
  animation:psychedelic-bg 4s ease infinite,neon-pulse 2s ease-in-out infinite;
  border:none;
  color:#fff;
  font-size:14px;
  font-weight:800;
  padding:16px 32px;
  box-shadow:0 4px 20px rgba(255,46,136,.4),0 0 40px rgba(185,103,255,.2);
}
.play-btn:active{
  transform:scale(.95);
  box-shadow:0 2px 10px rgba(255,46,136,.6);
}

/* LCD - cyberpunk display */
.lcd{
  background:linear-gradient(180deg,rgba(0,10,0,.95),rgba(0,30,15,.95));
  border:2px solid #00ff88;
  border-radius:8px;
  box-shadow:
    0 0 20px rgba(0,255,136,.3),
    0 0 60px rgba(0,255,136,.1),
    inset 0 0 30px rgba(0,255,136,.05);
  padding:16px;
  position:relative;
  overflow:hidden;
}
.lcd::after{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,255,136,.5),transparent);
  animation:scanline 3s linear infinite;
}
@keyframes scanline{
  0%{top:0}
  100%{top:100%}
}

/* Knobs - 3D effect */
.knob{
  background:radial-gradient(circle at 30% 30%,rgba(185,103,255,.3),rgba(20,0,40,.9));
  border:2px solid rgba(185,103,255,.4);
  box-shadow:
    0 4px 15px rgba(0,0,0,.4),
    0 0 15px rgba(185,103,255,.2),
    inset 0 2px 5px rgba(255,255,255,.1);
  width:60px;
  height:60px;
}
.knob:active{
  box-shadow:
    0 2px 8px rgba(0,0,0,.4),
    0 0 25px rgba(255,46,136,.4);
  border-color:#ff2e88;
}

/* XY Pad - immersive */
.xyPad{
  background:
    radial-gradient(circle at 30% 30%,rgba(0,255,200,.08),transparent 50%),
    radial-gradient(circle at 70% 70%,rgba(185,103,255,.08),transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(10,0,30,.9),rgba(20,0,50,.9));
  border:2px solid rgba(0,255,200,.3);
  border-radius:12px;
  box-shadow:
    0 0 40px rgba(0,255,200,.15),
    inset 0 0 60px rgba(185,103,255,.08);
  min-height:200px;
}
.xyDot{
  width:20px;
  height:20px;
  background:radial-gradient(circle,#fff,#00ffc8,#b967ff);
  box-shadow:
    0 0 20px #00ffc8,
    0 0 40px rgba(185,103,255,.6),
    0 0 60px rgba(255,46,136,.3);
  border-radius:50%;
}

/* Pads - 3D tactile */
.pad{
  background:linear-gradient(145deg,rgba(255,46,136,.15),rgba(185,103,255,.15));
  border:1px solid rgba(255,46,136,.3);
  border-radius:12px;
  box-shadow:
    0 4px 15px rgba(0,0,0,.3),
    0 0 10px rgba(255,46,136,.15),
    inset 0 1px 0 rgba(255,255,255,.05);
  min-height:60px;
  transition:all .15s;
}
.pad:active{
  background:linear-gradient(145deg,rgba(255,46,136,.4),rgba(185,103,255,.4));
  box-shadow:
    0 2px 8px rgba(0,0,0,.3),
    0 0 30px rgba(255,46,136,.5);
  transform:scale(.95) translateY(2px);
}

/* Sequencer cells - neon grid */
.seq-cell{
  background:rgba(20,0,40,.5);
  border:1px solid rgba(185,103,255,.15);
  border-radius:4px;
  min-width:28px;
  min-height:28px;
  transition:all .15s;
}
.seq-cell.on{
  background:linear-gradient(135deg,#ff2e88,#b967ff);
  box-shadow:0 0 12px rgba(255,46,136,.5),0 0 24px rgba(185,103,255,.3);
  border-color:transparent;
}

/* Beat dots - pulsing */
.beat-dot{
  width:16px;
  height:16px;
  border-radius:50%;
  background:rgba(20,0,40,.6);
  border:2px solid rgba(185,103,255,.3);
  transition:all .1s;
}
.beat-dot.on{
  background:radial-gradient(circle,#fff,#00ffc8);
  box-shadow:0 0 15px #00ffc8,0 0 30px rgba(0,255,200,.4);

}

/* Macro buttons - elemental */
.macro-btn{
  border-radius:12px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
}
#macroSpaceBtn{
  background:linear-gradient(135deg,rgba(0,170,255,.2),rgba(0,100,200,.2));
  border:2px solid rgba(0,170,255,.5);
  color:#00aaff;
  box-shadow:0 0 15px rgba(0,170,255,.2);
}
#macroEnergyBtn{
  background:linear-gradient(135deg,rgba(255,102,0,.2),rgba(255,50,0,.2));
  border:2px solid rgba(255,102,0,.5);
  color:#ff6600;
  box-shadow:0 0 15px rgba(255,102,0,.2);
}
#macroTensionBtn{
  background:linear-gradient(135deg,rgba(255,46,136,.2),rgba(200,0,100,.2));
  border:2px solid rgba(255,46,136,.5);
  color:#ff2e88;
  box-shadow:0 0 15px rgba(255,46,136,.2);
}

/* FX buttons - toggle glow */
.fx-btn{
  border-radius:8px;
  padding:10px 14px;
  font-size:11px;
}
.fx-btn.on{
  background:linear-gradient(135deg,rgba(0,255,200,.25),rgba(185,103,255,.25));
  border-color:#00ffc8;
  box-shadow:0 0 20px rgba(0,255,200,.4),0 0 40px rgba(0,255,200,.1);
  color:#00ffc8;
}

/* Timeline - flowing */
.tl-sec{
  border-radius:6px;
  padding:6px 10px;
  font-size:10px;
  transition:all .3s;
}
.tl-sec.current{
  background:linear-gradient(90deg,rgba(255,46,136,.3),rgba(185,103,255,.3));
  border-color:#ff2e88;
  box-shadow:0 0 15px rgba(255,46,136,.3);
  transform:scale(1.05);
}

/* Status bar - glowing */
#status{
  color:#00ffc8;
  text-shadow:0 0 8px rgba(0,255,200,.5);
  font-size:11px;
  letter-spacing:1px;
}

/* Safe area for mobile */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  body{padding-bottom:env(safe-area-inset-bottom)}
  .transport{padding-bottom:env(safe-area-inset-bottom)}
}

/* Responsive */
@media(max-width:480px){
  .knob{width:50px;height:50px}
  .xyPad{min-height:180px}
  .pad{min-height:50px}
  button{padding:10px 12px;font-size:11px}
}

<script>

/* ═══ POOLED ENGINE CONSTANTS ═══ */
const SYNTH_VOICES=20;
const DRUM_VOICES=24;

class SynthVoice{
  constructor(ctx,eng){
    this.ctx=ctx;this.eng=eng;this.bus=null;
    this.osc1=ctx.createOscillator();
    this.osc2=ctx.createOscillator();
    this.g1=ctx.createGain();this.g2=ctx.createGain();
    this.filter=ctx.createBiquadFilter();this.filter.type='lowpass';
    this.vca=ctx.createGain();this.vca.gain.value=0;
    this.lfo=ctx.createOscillator();
    this.lfoGain=ctx.createGain();this.lfoGain.gain.value=0;
    this.osc1.connect(this.g1);this.osc2.connect(this.g2);
    this.g1.connect(this.filter);this.g2.connect(this.filter);
    this.filter.connect(this.vca);
    this.lfo.connect(this.lfoGain);this.lfoGain.connect(this.filter.frequency);
    this.osc1.start();this.osc2.start();this.lfo.start();
    this.active=false;
  }
  connect(bus){
    if(this.bus!==bus){this.vca.disconnect();this.vca.connect(bus);this.bus=bus}
  }
  noteOn(when,midi,preset,dur){
    const freq=midiToFreq(midi);
    const t=when;
    try{
      this.osc1.type=preset.wave1||'sawtooth';
      this.osc2.type=preset.wave2||'sawtooth';
      this.osc1.frequency.setValueAtTime(freq,t);
      this.osc2.frequency.setValueAtTime(freq*Math.pow(2,(preset.oct2||0)/12),t);
      this.osc2.detune.setValueAtTime(preset.detune||0,t);
      this.filter.type=preset.fType||'lowpass';
      this.filter.frequency.setValueAtTime(preset.cutoff||1500,t);
      this.filter.Q.setValueAtTime(preset.res||3,t);
      // ADSR envelope
      const atk=preset.atk||0.005,dec=preset.dec||0.3,sus=preset.sus||0.6,rel=preset.rel||0.2;
      const gateDur=dur||0.2;
      this.vca.gain.cancelScheduledValues(t);
      this.vca.gain.setValueAtTime(0,t);
      this.vca.gain.linearRampToValueAtTime(0.7,t+atk);
      this.vca.gain.linearRampToValueAtTime(0.7*sus,t+atk+dec);
      this.vca.gain.setValueAtTime(0.7*sus,t+gateDur);
      this.vca.gain.linearRampToValueAtTime(0,t+gateDur+rel);
      this.active=true;
      const self=this;
      setTimeout(()=>{self.active=false},(gateDur+rel)*1000+50);
    }catch(e){}
  }
  panic(){
    try{this.vca.gain.cancelScheduledValues(0);this.vca.gain.setValueAtTime(0,this.ctx.currentTime)}catch(e){}
    this.active=false;
  }
}

class DrumVoice{
  constructor(ctx,eng){
    this.ctx=ctx;this.eng=eng;this.bus=null;
    // Noise source (looped)
    this.noise=ctx.createBufferSource();
    this.noise.buffer=eng.noiseBuffer;
    this.noise.loop=true;
    this.noiseGain=ctx.createGain();this.noiseGain.gain.value=0;
    this.nFilter=ctx.createBiquadFilter();this.nFilter.type='bandpass';
    this.noise.connect(this.nFilter);this.nFilter.connect(this.noiseGain);
    // Sine osc for kick/tom
    this.osc=ctx.createOscillator();this.osc.type='sine';
    this.oscGain=ctx.createGain();this.oscGain.gain.value=0;
    this.osc.connect(this.oscGain);
    // Output
    this.out=ctx.createGain();
    this.noiseGain.connect(this.out);this.oscGain.connect(this.out);
    this.noise.start();this.osc.start();
    this.active=false;
  }
  connect(bus){
    if(this.bus!==bus){this.out.disconnect();this.out.connect(bus);this.bus=bus}
  }
  hit(when,preset,vel){
    const t=when;
    const decay=preset.decay||0.5;
    const tune=preset.tune||1;
    try{
      if(preset.type==='kick'){
        // Kick: sine pitch drop + punch
        const startFreq=150*tune;
        const endFreq=40*tune;
        this.osc.frequency.setValueAtTime(startFreq,t);
        this.osc.frequency.exponentialRampToValueAtTime(endFreq,t+0.08);
        this.oscGain.gain.cancelScheduledValues(t);
        this.oscGain.gain.setValueAtTime(0,t);
        this.oscGain.gain.linearRampToValueAtTime(vel*(preset.punch||0.5),t+0.005);
        this.oscGain.gain.exponentialRampToValueAtTime(0.001,t+decay);
        this.noiseGain.gain.setValueAtTime(0,t);
      } else if(preset.type==='snare'||preset.type==='clap'){
        // Snare/Clap: noise burst + tone
        this.nFilter.frequency.setValueAtTime(2000*(preset.tone||1),t);
        this.nFilter.Q.setValueAtTime(1,t);
        this.noiseGain.gain.cancelScheduledValues(t);
        this.noiseGain.gain.setValueAtTime(0,t);
        this.noiseGain.gain.linearRampToValueAtTime(vel*0.6,t+0.003);
        this.noiseGain.gain.exponentialRampToValueAtTime(0.001,t+decay*0.5);
        this.osc.frequency.setValueAtTime(200*tune,t);
        this.oscGain.gain.setValueAtTime(vel*0.3,t);
        this.oscGain.gain.exponentialRampToValueAtTime(0.001,t+0.05);
      } else if(preset.type==='hatC'||preset.type==='hatO'){
        // Hat: filtered noise, short decay
        this.nFilter.frequency.setValueAtTime(8000*(preset.tone||1),t);
        this.nFilter.Q.setValueAtTime(2,t);
        this.noiseGain.gain.cancelScheduledValues(t);
        this.noiseGain.gain.setValueAtTime(0,t);
        this.noiseGain.gain.linearRampToValueAtTime(vel*0.4,t+0.002);
        this.noiseGain.gain.exponentialRampToValueAtTime(0.001,t+decay*0.3);
        this.oscGain.gain.setValueAtTime(0,t);
      } else if(preset.type==='tom'||preset.type==='perc'){
        // Tom/Perc: sine with pitch
        this.osc.frequency.setValueAtTime(200*tune,t);
        this.osc.frequency.exponentialRampToValueAtTime(80*tune,t+decay*0.5);
        this.oscGain.gain.cancelScheduledValues(t);
        this.oscGain.gain.setValueAtTime(0,t);
        this.oscGain.gain.linearRampToValueAtTime(vel*0.5,t+0.005);
        this.oscGain.gain.exponentialRampToValueAtTime(0.001,t+decay);
        this.noiseGain.gain.setValueAtTime(vel*0.1,t);
        this.noiseGain.gain.exponentialRampToValueAtTime(0.001,t+0.05);
      } else {
        // Generic: noise burst
        this.noiseGain.gain.cancelScheduledValues(t);
        this.noiseGain.gain.setValueAtTime(vel*0.3,t);
        this.noiseGain.gain.exponentialRampToValueAtTime(0.001,t+decay);
        this.oscGain.gain.setValueAtTime(0,t);
      }
      this.active=true;
      const self=this;
      setTimeout(()=>{self.active=false},decay*1000+100);
    }catch(e){}
  }
  panic(){
    try{
      this.noiseGain.gain.cancelScheduledValues(0);this.noiseGain.gain.setValueAtTime(0,this.ctx.currentTime);
      this.oscGain.gain.cancelScheduledValues(0);this.oscGain.gain.setValueAtTime(0,this.ctx.currentTime);
    }catch(e){}
    this.active=false;
  }
}

class PooledEngine{
  constructor(ctx){
    this.ctx=ctx;
    // Master chain: master -> comp -> analyser -> destination
    this.master=ctx.createGain();this.master.gain.value=0.85;
    this.comp=ctx.createDynamicsCompressor();
    this.comp.threshold.value=-8;this.comp.knee.value=12;
    this.comp.ratio.value=6;this.comp.attack.value=0.003;this.comp.release.value=0.2;
    this.analyser=ctx.createAnalyser();this.analyser.fftSize=256;
    // Master filter (XY pad controls this)
    this.masterFilter=ctx.createBiquadFilter();
    this.masterFilter.type='lowpass';
    this.masterFilter.frequency.value=18000;
    this.masterFilter.Q.value=0.5;
    // Delay send (dotted-8th feedback)
    this.delay=ctx.createDelay(2.0);
    this.delay.delayTime.value=0.3;
    this.delayFeedback=ctx.createGain();this.delayFeedback.gain.value=0.35;
    this.delayMix=ctx.createGain();this.delayMix.gain.value=0.22;
    // Reverb send
    this.reverb=ctx.createConvolver();
    this.reverb.buffer=this.makeImpulse(2.5,3.0);
    this.reverbMix=ctx.createGain();this.reverbMix.gain.value=0.18;
    // Drive (waveshaper)
    this.drive=ctx.createWaveShaper();
    this.drive.curve=this.makeDriveCurve(0);
    this.drive.oversample='2x';
    // Chain: master -> drive -> masterFilter -> comp -> analyser -> destination
    this.master.connect(this.drive);
    this.drive.connect(this.masterFilter);
    this.masterFilter.connect(this.comp);
    // Delay send: masterFilter -> delay (with feedback loop) -> delayMix -> comp
    this.masterFilter.connect(this.delay);
    this.delay.connect(this.delayFeedback);
    this.delayFeedback.connect(this.delay);
    this.delay.connect(this.delayMix);
    this.delayMix.connect(this.comp);
    // Reverb send: masterFilter -> reverb -> reverbMix -> comp
    this.masterFilter.connect(this.reverb);
    this.reverb.connect(this.reverbMix);
    this.reverbMix.connect(this.comp);
    this.comp.connect(this.analyser);
  try{this.engine=new PooledEngine(ctx);this.engine.setMasterGain(0.85);}catch(e){this.engine=null;}
    this.analyser.connect(ctx.destination);
    // Recording destination (for live capture)
    this.recDest=ctx.createMediaStreamDestination();
    this.comp.connect(this.recDest);
    // Noise buffer
    const bufLen=ctx.sampleRate*2;
    this.noiseBuffer=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=this.noiseBuffer.getChannelData(0);
    for(let i=0;i<bufLen;i++)data[i]=Math.random()*2-1;
    // Track buses
    this.trackBuses=[];
    for(let i=0;i<6;i++){
      const g=ctx.createGain();g.gain.value=0.8;g.connect(this.master);
      this.trackBuses.push(g);
    }
    // Voice pools
    this.synthPool=[];this.drumPool=[];
    for(let i=0;i<SYNTH_VOICES;i++){
      const v=new SynthVoice(ctx,this);
      v.connect(this.trackBuses[1]); // default to bass bus
      this.synthPool.push(v);
    }
    for(let i=0;i<DRUM_VOICES;i++){
      const v=new DrumVoice(ctx,this);
      v.connect(this.trackBuses[0]); // default to kick bus
      this.drumPool.push(v);
    }
    this.synthIdx=0;this.drumIdx=0;
    this.spawnCount=0;
  }
  nextSynth(){
    const v=this.synthPool[this.synthIdx];
    this.synthIdx=(this.synthIdx+1)%SYNTH_VOICES;
    return v;
  }
  nextDrum(){
    const v=this.drumPool[this.drumIdx];
    this.drumIdx=(this.drumIdx+1)%DRUM_VOICES;
    return v;
  }
  triggerSynth(when,midi,preset,dur,trackIdx){
    const v=this.nextSynth();
    v.connect(this.trackBuses[trackIdx||1]);
    v.noteOn(when,midi,preset,dur);
    this.spawnCount++;
  }
  triggerDrum(when,preset,vel,trackIdx){
    const v=this.nextDrum();
    v.connect(this.trackBuses[trackIdx||0]);
    v.hit(when,preset,vel);
    this.spawnCount++;
  }
  makeImpulse(dur,decay){
    const len=this.ctx.sampleRate*dur;
    const buf=this.ctx.createBuffer(2,len,this.ctx.sampleRate);

        else{
          var move=Math.floor(rnd()*5)-2;
          deg=clamp(deg+move,0,L-1);
        }
        bar.push(deg);
      } else bar.push(null);
    }
    return {bar:bar,lastDeg:deg};
  }
  var startDeg=stable[Math.floor(rnd()*stable.length)];
  var A=genBar(startDeg);
  var cnt=0,q;
  for(q=0;q<16;q++) if(A.bar[q]!==null) cnt++;
  if(cnt<5){
    var forced=[0,4,8,12];
    for(q=0;q<forced.length;q++) if(A.bar[forced[q]]===null) A.bar[forced[q]]=nearestStableDeg(stable,A.lastDeg);
  }
  var shift=(rnd()<0.5)?1:-1;
  var resp=[];
  var s2;
  for(s2=0;s2<16;s2++){
    if(A.bar[s2]===null) resp.push(null);
    else resp.push(clamp(A.bar[s2]+shift,0,L-1));
  }
  for(var s3=15;s3>=0;s3--){
    if(resp[s3]!==null){ resp[s3]=nearestStableDeg(stable,0); break; }
  }
  var lead=[];
  var prevDeg=null;
  function push(sIdx,deg){
    var slide=0;
    if(prevDeg!==null){
      var iv=Math.abs(SCALE_EXT[deg]-SCALE_EXT[prevDeg]);
      if((iv===2||iv===3)&&rnd()<STYLE.glideChance) slide=1;
    }
    lead.push({deg:deg,acc:accentFor(sIdx),slide:slide});
    prevDeg=deg;
  }
  var s4;
  for(s4=0;s4<16;s4++){
    if(A.bar[s4]===null) lead.push(null);
    else push(s4,A.bar[s4]);
  }
  for(s4=0;s4<16;s4++){
    if(resp[s4]===null) lead.push(null);
    else push(s4,resp[s4]);
  }
  return lead;
}

/* Arp: spiral over root-b2-3-5-octave (signature Phrygian Dominant colors) */
function makeArpPhrase(rnd){
  var arp=[];
  var pool=[0,1,2,4,7];
  var ai=Math.floor(rnd()*pool.length);
  var dir=1;
  for(var s=0;s<16;s++){
    if(rnd()<0.85){
      arp.push({deg:pool[ai]});
      ai+=dir;
      if(ai>=pool.length){ ai=pool.length-2; dir=-1; }
      if(ai<0){ ai=1; dir=1; }
    } else arp.push(null);
  }
  return arp;
}

function makePatterns(seed){
  var rnd=mulberry32(seed);
  var s;
  /* kick: four-on-the-floor */
  var kick=[1,0,0,0,1,0,0,0,1,0,0,0,1,0,0,0];
  /* bass: K-B-B-B rolling gallop, root drone + passing tones + octave lift */
  var bass=[];
  for(s=0;s<16;s++){
    if(s%4===0){ bass.push(null); continue; }
    var n=0;
    var r=rnd();
    if(s===15&&r<STYLE.bassOctaveChance){ n=12; }
    else if((s===7||s===11)&&r<STYLE.bassPassingChance){ n=(rnd()<0.5)?10:7; }
    bass.push({n:n});
  }
  /* perc: claps on 2 & 4, shakers, occasional open hat */
  var perc=[];
  for(s=0;s<16;s++){
    if(s===4||s===12){ perc.push("clap"); continue; }
    if(s===14&&rnd()<0.5){ perc.push("oh"); continue; }
    if(s%4===2){ perc.push("shaker"); continue; }
    if(s%2===1&&rnd()<0.30){ perc.push("shaker"); continue; }
    perc.push(null);
  }
  /* lead: 2-bar call & response motif */
  var lead=makeLeadMotif(rnd);
  /* arp: Phrygian Dominant spiral */
  var arp=makeArpPhrase(rnd);
  /* pad: root-fifth-octave drone (modal, no third) */
  var pad=[];
  for(s=0;s<16;s++) pad.push(null);
  pad[0]={chord:[0,4,7]};
  return {kick:kick,bass:bass,perc:perc,lead:lead,arp:arp,pad:pad};
}

/* ---------- synth voices ---------- */
function makeVoices(ctx,outMap,sends,noiseBuf,cfg){
  function kick(t){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";
    var cfg=this.cfg();
    o.frequency.setValueAtTime(cfg.kickStart,t);
    o.frequency.exponentialRampToValueAtTime(cfg.kickEnd,t+0.04);
    g.gain.setValueAtTime(1.0,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.10);
    o.connect(g); g.connect(outMap.KICK);
    o.start(t); o.stop(t+0.13);
    var cs=ctx.createBufferSource(); cs.buffer=noiseBuf;
    var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=3000; bp.Q.value=1.2;
    var cg=ctx.createGain();
    cg.gain.setValueAtTime(0.35,t);
    cg.gain.exponentialRampToValueAtTime(0.001,t+0.015);
    cs.connect(bp); bp.connect(cg); cg.connect(outMap.KICK);
    cs.start(t); cs.stop(t+0.02);
  }
  function bassNote(t,midi,dur){
    var f=mtof(midi);
    var o=ctx.createOscillator(); o.type=cfg.bassWave; o.frequency.value=f;
    var flt=ctx.createBiquadFilter(); flt.type="lowpass"; flt.Q.value=cfg.bassRes;
    var c0=Math.min(cfg.bassCut*2.8,ctx.sampleRate*0.4);
    var c1=Math.max(90,cfg.bassCut*0.45);
    flt.frequency.setValueAtTime(c0,t);
    flt.frequency.exponentialRampToValueAtTime(c1,t+0.14);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(cfg.bassLvl,t+0.005);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(flt); flt.connect(g); g.connect(outMap.BASS);
    o.start(t); o.stop(t+dur+0.03);
  }
  function leadNote(t,midi,opts){
    opts=opts||{};
    var f=mtof(midi);
    var o1=ctx.createOscillator(),o2=ctx.createOscillator();
    o1.type="sawtooth"; o2.type="sawtooth";
    var d=Math.pow(2,7/1200);
    if(opts.slide&&opts.fromMidi){
      var ff=mtof(opts.fromMidi);
      o1.frequency.setValueAtTime(ff,t);
      o1.frequency.exponentialRampToValueAtTime(f,t+0.035);
      o2.frequency.setValueAtTime(ff*d,t);
      o2.frequency.exponentialRampToValueAtTime(f*d,t+0.035);
    } else {
      o1.frequency.value=f; o2.frequency.value=f*d;
    }
    var flt=ctx.createBiquadFilter(); flt.type="lowpass"; flt.Q.value=cfg.leadRes;
    var acc=opts.acc||0;
    var peak=Math.min(cfg.leadCut*(acc===2?1.4:(acc===1?1.2:1.0)),ctx.sampleRate*0.42);
    flt.frequency.setValueAtTime(280,t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(300,peak),t+0.016);
    flt.frequency.exponentialRampToValueAtTime(380,t+0.22);
    var g=ctx.createGain();
    var lvl=cfg.leadLvl*(acc===2?1.0:(acc===1?0.85:0.7));
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(lvl,t+0.009);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
    o1.connect(flt); o2.connect(flt); flt.connect(g); g.connect(outMap.LEAD);
    if(sends.delay){ var sd=ctx.createGain(); sd.gain.value=0.4; g.connect(sd); sd.connect(sends.delay); }
    if(sends.reverb){ var sr2=ctx.createGain(); sr2.gain.value=0.25; g.connect(sr2); sr2.connect(sends.reverb); }
    o1.start(t); o2.start(t); o1.stop(t+0.26); o2.stop(t+0.26);
  }
  function arpNote(t,midi,acc){
    var f=mtof(midi);
    var o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=f;
    var flt=ctx.createBiquadFilter(); flt.type="lowpass"; flt.Q.value=cfg.arpRes;
    var cut=acc?cfg.arpCut*1.4:cfg.arpCut;
    flt.frequency.setValueAtTime(Math.max(200,cut*0.5),t);
    flt.frequency.exponentialRampToValueAtTime(Math.min(cut,ctx.sampleRate*0.4),t+0.012);
    flt.frequency.exponentialRampToValueAtTime(300,t+0.11);
    var g=ctx.createGain();
    var lvl=cfg.arpLvl*(acc?1:0.7);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(lvl,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
    o.connect(flt); flt.connect(g); g.connect(outMap.ARP);
    if(sends.delay){ var sd=ctx.createGain(); sd.gain.value=0.5; g.connect(sd); sd.connect(sends.delay); }
    o.start(t); o.stop(t+0.15);
  }
  function padChord(t,midis,dur){
    var flt=ctx.createBiquadFilter(); flt.type="lowpass"; flt.Q.value=1.1;
    flt.frequency.value=cfg.padCut;
    var lfo=ctx.createOscillator(); lfo.frequency.value=0.13;
    var lfoG=ctx.createGain(); lfoG.gain.value=cfg.padCut*0.45;
    lfo.connect(lfoG); lfoG.connect(flt.frequency);
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(cfg.padLvl,t+0.7);
    g.gain.setTargetAtTime(0.0001,t+dur,0.45);
    flt.connect(g); g.connect(outMap.PAD);
    if(sends.reverb){ var sr2=ctx.createGain(); sr2.gain.value=0.5; g.connect(sr2); sr2.connect(sends.reverb); }
    for(var i=0;i<midis.length;i++){
      var f=mtof(midis[i]);
      var o1=ctx.createOscillator(); o1.type="sawtooth"; o1.frequency.value=f; o1.detune.value=-6;
      var o2=ctx.createOscillator(); o2.type="sawtooth"; o2.frequency.value=f; o2.detune.value=6;
      var og=ctx.createGain(); og.gain.value=0.5/midis.length+0.12;
      o1.connect(og); o2.connect(og); og.connect(flt);
      o1.start(t); o2.start(t);
      o1.stop(t+dur+2.6); o2.stop(t+dur+2.6);
    }
    lfo.start(t); lfo.stop(t+dur+2.6);
  }
  function clap(t,v){
    for(var k=0;k<3;k++){
      var tt=t+k*0.009;
      var cs=ctx.createBufferSource(); cs.buffer=noiseBuf;
      var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1500; bp.Q.value=1.8;
      var g=ctx.createGain();
      g.gain.setValueAtTime((v||0.8)*(k===2?1:0.7),tt);
      g.gain.exponentialRampToValueAtTime(0.001,tt+0.03+(k===2?0.05:0));
      cs.connect(bp); bp.connect(g); g.connect(outMap.PERC);
      if(sends.reverb){ var sr2=ctx.createGain(); sr2.gain.value=0.2; g.connect(sr2); sr2.connect(sends.reverb); }
      cs.start(tt); cs.stop(tt+0.09);
    }
  }
  function shaker(t,v){
    var cs=ctx.createBufferSource(); cs.buffer=noiseBuf;
    var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=8200;
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.22*v,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.045);
    cs.connect(hp); hp.connect(g); g.connect(outMap.PERC);
    cs.start(t); cs.stop(t+0.05);
  }
  function openhat(t,v){
    var cs=ctx.createBufferSource(); cs.buffer=noiseBuf;
    var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=7200;
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.35*v,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
    cs.connect(hp); hp.connect(g); g.connect(outMap.PERC);
    cs.start(t); cs.stop(t+0.21);
  }
  function snare(t,v){
    var cs=ctx.createBufferSource(); cs.buffer=noiseBuf;
    var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1900; bp.Q.value=0.9;
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.7*v,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    cs.connect(bp); bp.connect(g); g.connect(outMap.PERC);
    cs.start(t); cs.stop(t+0.13);
    var o=ctx.createOscillator(); o.type="triangle"; o.frequency.value=185;
    var og=ctx.createGain();
    og.gain.setValueAtTime(0.4*v,t);
    og.gain.exponentialRampToValueAtTime(0.001,t+0.05);
    o.connect(og); og.connect(outMap.PERC);
    o.start(t); o.stop(t+0.06);
  }
  var crashBuf=(function(){
    var len=Math.floor(ctx.sampleRate*1.2);
    var b=ctx.createBuffer(1,len,ctx.sampleRate);
    var d=b.getChannelData(0);
    var seed=777;
    for(var i=0;i<len;i++){ seed=(seed*16807)%2147483647; d[i]=((seed/2147483647)*2-1)*(1-i/len); }
    return b;
  })();
  function crash(t,lvl){
    var cs=ctx.createBufferSource(); cs.buffer=crashBuf;
    var hp=ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=3500;
    var g=ctx.createGain();
    g.gain.setValueAtTime(0.5*lvl,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    cs.connect(hp); hp.connect(g); g.connect(outMap.PERC);
    if(sends.reverb){ var sr2=ctx.createGain(); sr2.gain.value=0.5; g.connect(sr2); sr2.connect(sends.reverb); }
    cs.start(t); cs.stop(t+1.15);
  }
  return {kick:kick,bassNote:bassNote,leadNote:leadNote,arpNote:arpNote,padChord:padChord,
          clap:clap,shaker:shaker,openhat:openhat,snare:snare,crash:crash};
}

/* ---------- song engine M2: sub-seeds, song model, themes, bass styles, fills, energy ---------- */

function subSeed(parentSeed,label){
  var h=(parentSeed>>>0)^0x9E3779B9;
  for(var i=0;i<label.length;i++){
    h=Math.imul(h^label.charCodeAt(i),0x85EBCA6B);
    h=(h^(h>>>13))>>>0;
  }
  h=Math.imul(h^(h>>>16),0x27D4EB2F);
  return (h^(h>>>15))>>>0;
}
function rngFor(parentSeed,label){ return mulberry32(subSeed(parentSeed,label)); }
var SECTION_TEMPLATE=[
  ["INTRO",32,"transition","intro","pedal"],
  ["BUILD",16,"transition","drop","gallop"],
  ["DROP",32,"A","drop","gallop"],
  ["BREAK",32,"B","break","pedal"],
  ["RISER",8,"transition","riser","offbeat"],
  ["DROP2",32,"A2","drop2","gallop"],
  ["OUTRO",24,"transition","intro","pedal"]
];
function buildSong(seed,opts){
  opts=opts||{};
  var root=opts.root!=null?opts.root:33;
  var bpm=opts.bpm!=null?opts.bpm:145;
  var modes={intro:"phrygian",drop:"phrygianDominant",break:"harmonicMinor",riser:"phrygian",drop2:"phrygianDominant"};
  var drop2RootOffset=rngFor(seed,"drop2mod")()<0.5?0:2;
  var sections=[];
  for(var i=0;i<SECTION_TEMPLATE.length;i++){
    var row=SECTION_TEMPLATE[i];
    sections.push({name:row[0],bars:row[1],themeKey:row[2],mode:row[3],bassStyle:row[4],
      rootOffset:row[0]==="DROP2"?drop2RootOffset:0});
  }
  var cursor=0,sectionStarts=[];
  for(i=0;i<sections.length;i++){ sectionStarts.push(cursor); cursor+=sections[i].bars; }
  var themes={
    A:buildTheme(seed,"A",root+24,modes.drop),
    A2:buildTheme(seed,"A2",root+24+drop2RootOffset,modes.drop2,{deriveFrom:"A"}),
    B:buildTheme(seed,"B",root+24,modes.break,{register:-12,emotional:true}),
    transition:buildTransitionTheme(seed,root+24,modes.intro)
  };
  return {seed:seed,root:root,bpm:bpm,modes:modes,drop2RootOffset:drop2RootOffset,
    themes:themes,sections:sections,sectionStarts:sectionStarts,totalBars:cursor};
}
function sectionAt(song,absBar){
  var bar=((absBar%song.totalBars)+song.totalBars)%song.totalBars;
  var lo=0,hi=song.sections.length-1;
  while(lo<hi){ var mid=(lo+hi+1)>>1; if(song.sectionStarts[mid]<=bar) lo=mid; else hi=mid-1; }
  return {section:song.sections[lo],sectionIndex:lo,barInSection:bar-song.sectionStarts[lo],barInTrack:bar};
}
function degreeToSemitone(scaleIntervals,deg){
  var len=scaleIntervals.length;
  var oct=Math.floor(deg/len);
  var idx=((deg%len)+len)%len;
  return scaleIntervals[idx]+12*oct;
}
function cloneEv(ev,extra){
  var out={};
  for(var k in ev) out[k]=ev[k];
  if(extra) for(var k2 in extra) out[k2]=extra[k2];
  return out;
}
function renderMotif(motif,rootMidi,scaleIntervals){
  return motif.map(function(ev){
    if(ev.rest) return ev;
    return cloneEv(ev,{midi:rootMidi+degreeToSemitone(scaleIntervals,ev.deg)+12*ev.oct});
  });
}
function transposeDegree(motif,n){
  return motif.map(function(ev){ return ev.rest?ev:cloneEv(ev,{deg:ev.deg+n}); });
}
function transposeOctave(motif,n){
  return motif.map(function(ev){ return ev.rest?ev:cloneEv(ev,{oct:ev.oct+n}); });
}
function invert(motif){
  var firstIdx=-1;
  for(var i=0;i<motif.length;i++){ if(!motif[i].rest){ firstIdx=i; break; } }
  if(firstIdx===-1) return motif.slice();
  var pivot=motif[firstIdx].deg;
  return motif.map(function(ev){ return ev.rest?ev:cloneEv(ev,{deg:pivot-(ev.deg-pivot)}); });
}
function retrograde(motif){ return motif.slice().reverse(); }
function displace(motif,steps){
  var totalSteps=0,i,j;
  for(i=0;i<motif.length;i++) totalSteps+=motif[i].dur;
  if(totalSteps===0) return motif.slice();
  var shift=((steps%totalSteps)+totalSteps)%totalSteps;
  if(shift===0) return motif.slice();
  var expanded=[];
  for(i=0;i<motif.length;i++) for(j=0;j<motif[i].dur;j++) expanded.push(motif[i]);
  var rotated=expanded.slice(shift).concat(expanded.slice(0,shift));
  var seam=rotated.length-shift;
  var out=[];
  for(i=0;i<rotated.length;i++){
    var src=rotated[i];
    var prev=i>0?rotated[i-1]:null;
    if(prev===src&&i!==seam){ out[out.length-1].dur+=1; }
    else{ out.push({deg:src.deg,oct:src.oct,dur:1,accent:src.accent,rest:src.rest}); }
  }
  return out;
}
function fragment(motif,startIdx,len,repeats){
  var frag=motif.slice(startIdx,startIdx+len);
  var out=[];
  for(var i=0;i<repeats;i++) out=out.concat(frag);
  return out;
}
function scaleDuration(motif,factor){
  return motif.map(function(ev){ return cloneEv(ev,{dur:Math.max(1,Math.round(ev.dur*factor))}); });
}
function buildTheme(seed,themeKey,rootMidi,scaleKey,opts){
  opts=opts||{};
  var rng=rngFor(seed,"theme:"+themeKey);
  var register=opts.register!=null?opts.register:0;
  var emotional=!!opts.emotional;
  var cellLen=emotional?8:16;
  var strongSteps=cellLen===16?[0,8]:[0,4];
  var degreePool=emotional?[0,2,4,-3]:[0,1,2,4,5];
  var cell=[],stepsUsed=0;
  while(stepsUsed<cellLen){
    var dur=emotional?(rng()<0.5?4:2):(rng()<0.7?1:2);
    dur=Math.min(dur,cellLen-stepsUsed);
    var isStrong=strongSteps.indexOf(stepsUsed)!==-1;
    var deg=isStrong?(rng()<0.6?0:4):degreePool[Math.floor(rng()*degreePool.length)];
    var rest=!isStrong&&rng()<(emotional?0.35:0.12);
    cell.push({deg:deg,oct:0,dur:dur,accent:isStrong?1:(rng()<0.3?0.6:0.3),rest:rest});
    stepsUsed+=dur;
  }
  var seedCell=cell;
  if(opts.deriveFrom){ seedCell=transposeDegree(cell,3); }
  var phrasePlan=[
    {op:"identity"},
    {op:"displace",steps:Math.floor(cellLen/2)},
    {op:"transposeDegree",n:2},
    {op:"invert"}
  ];
  return {themeKey:themeKey,rootMidi:rootMidi,scaleKey:scaleKey,register:register,
    cellLen:cellLen,seedCell:seedCell,phrasePlan:phrasePlan};
}
function buildTransitionTheme(seed,rootMidi,scaleKey){
  var rng=rngFor(seed,"theme:transition");
  var cell=[];
  for(var i=0;i<16;i+=4){
    cell.push({deg:rng()<0.7?0:4,oct:0,dur:4,accent:i===0?1:0.4,rest:rng()<0.4});
  }
  return {themeKey:"transition",rootMidi:rootMidi,scaleKey:scaleKey,register:0,cellLen:16,seedCell:cell,
    phrasePlan:[{op:"identity"},{op:"identity"},{op:"fragment",startIdx:0,len:2,repeats:2},{op:"identity"}]};
}
function resolveThemeBar(theme,barInSection,scalesTable){
  var phraseIdx=barInSection%theme.phrasePlan.length;
  var step=theme.phrasePlan[phraseIdx];
  var motif=theme.seedCell;
  switch(step.op){
    case "identity": break;
    case "displace": motif=displace(motif,step.steps); break;
    case "transposeDegree": motif=transposeDegree(motif,step.n); break;
    case "invert": motif=invert(motif); break;
    case "retrograde": motif=retrograde(motif); break;
    case "fragment": motif=fragment(motif,step.startIdx,step.len,step.repeats); break;
    case "augment": motif=scaleDuration(motif,2); break;
    case "diminish": motif=scaleDuration(motif,0.5); break;
  }
  var scale=scalesTable[theme.scaleKey];
  return renderMotif(motif,theme.rootMidi+theme.register,scale);
}
var KICK_STEPS=[0,4,8,12];
var BassStyles={
  gallop:function(rootMidi,scale,barIndex,rng){
    var steps=new Array(16).fill(null);
    for(var s=0;s<16;s++){
      if(KICK_STEPS.indexOf(s)!==-1) continue;
      if(s===15&&barIndex%4===3){ steps[s]={midi:rootMidi+12,accent:0.8}; continue; }

  }).catch(function(e){ return {ok:false,reason:"render: "+e.message}; });

var midiClockEnabled=false;
var midiClockCount=0;
var midiClockLastTime=0;
var midiClockIntervals=[];
var midiClockDetectedBpm=0;

function toggleMidiClock(){
midiClockEnabled=!midiClockEnabled;
midiClockIntervals=[];
midiClockLastTime=0;
midiClockCount=0;
var st=$("status");
if(st)st.textContent="MIDI CLOCK: "+(midiClockEnabled?"ON":"OFF");
if(navigator.vibrate)navigator.vibrate([5,20,5]);
}

function handleMidiClock(status,data1,data2){
if(status===0xF8){
if(!midiClockEnabled)return;
var now=performance.now();
if(midiClockLastTime>0){
var interval=now-midiClockLastTime;
if(interval>0&&interval<500){
midiClockIntervals.push(interval);
if(midiClockIntervals.length>24)midiClockIntervals.shift();
if(midiClockIntervals.length>=6){
var avg=0;
for(var i=0;i<midiClockIntervals.length;i++)avg+=midiClockIntervals[i];
avg/=midiClockIntervals.length;
var bpm=60000/(avg*24);
midiClockDetectedBpm=Math.max(60,Math.min(200,Math.round(bpm)));
if(Math.abs(midiClockDetectedBpm-device.bpm)>=1){
var newBpm=device.bpm*0.7+midiClockDetectedBpm*0.3;
device.setKnob("bpm",Math.round(newBpm));
var st=$("status");
if(st)st.textContent="MIDI CLOCK: "+Math.round(newBpm)+" BPM";
}
}
}
}
midiClockLastTime=now;
midiClockCount++;
return true;
}
return false;
}

// GRAMMAR SYSTEM — Statistical Learning (from PSY4)
// ============================================================
const grammars = {
  bass: {
    // 12x12 interval transition matrix (probability)
    transitions: Array.from({length:12},()=>Array(12).fill(0)),
    total: 0,
    lastPc: null
  },
  rhythm: {
    // 16-step kick onset probability
    kickOnset: Array(16).fill(0),
    kickCount: Array(16).fill(0),
    hatDensity: 0,
    hatCount: 0
  },
  melodic: {
    // Interval histogram (-12 to +12)
    intervals: Array(25).fill(0),
    total: 0,
    lastMidi: null,
    contourDir: 0
  }
};

function decayGrammars(){
  // Gentle decay: multiply all weights by 0.95
  // This allows the system to adapt to new styles without forgetting everything
  const decay=0.95;
  for(let i=0;i<12;i++){
    for(let j=0;j<12;j++){
      grammars.bass.transitions[i][j]*=decay;
    }
  }
  for(let i=0;i<25;i++){
    grammars.melodic.intervals[i]*=decay;
  }
  for(let i=0;i<16;i++){
    grammars.rhythm.kickOnset[i]*=decay;
    grammars.rhythm.kickCount[i]*=decay;
  }
  grammars.bass.total*=decay;
  grammars.melodic.total*=decay;
}

function updateGrammars(trackName, step, midi){
  if(trackName==='bass'){
    const pc = midi % 12;
    if(grammars.bass.lastPc !== null){
      grammars.bass.transitions[grammars.bass.lastPc][pc]++;
      grammars.bass.total++;
      // Decay every 50 entries to allow style adaptation
      if(Math.round(grammars.bass.total)%50===0)decayGrammars();
    }
    grammars.bass.lastPc = pc;
  } else if(trackName==='kick'){
    if(step>=0&&step<16){
      grammars.rhythm.kickOnset[step]++;
      grammars.rhythm.kickCount[step]++;
    }
  } else if(trackName==='lead' || trackName==='arp'){
    if(grammars.melodic.lastMidi !== null){
      const interval = clamp(midi - grammars.melodic.lastMidi, -12, 12);
      grammars.melodic.intervals[interval + 12]++;
      grammars.melodic.total++;
      grammars.melodic.contourDir = interval > 0 ? 1 : (interval < 0 ? -1 : 0);
      // Decay every 50 entries
      if(Math.round(grammars.melodic.total)%50===0)decayGrammars();
    }
    grammars.melodic.lastMidi = midi;
  }
}

function sampleBassFromGrammar(rootPc){
  if(grammars.bass.total < 4) return rootPc; // not enough data
  const lastPc = grammars.bass.lastPc || rootPc;
  const row = grammars.bass.transitions[lastPc];
  const total = row.reduce((a,b)=>a+b, 0);
  if(total === 0) return rootPc;
  // Weighted random selection
  let r = rand() * total;
  for(let pc=0; pc<12; pc++){
    r -= row[pc];
    if(r <= 0) return (rootPc + pc) % 12 + 36; // bass register
  }
  return rootPc + 36;
}

function sampleMelodicInterval(){
  if(grammars.melodic.total < 4) return pick([-2,-1,1,2,3]); // not enough data
  const total = grammars.melodic.intervals.reduce((a,b)=>a+b, 0);
  if(total === 0) return 0;
  let r = rand() * total;
  for(let i=0; i<25; i++){
    r -= grammars.melodic.intervals[i];
    if(r <= 0) return i - 12;
  }
  return 0;
}
function grammarConfidence(){
  const bassConf = Math.min(grammars.bass.total / 20, 1);
  const melConf = Math.min(grammars.melodic.total / 20, 1);
  return (bassConf + melConf) / 2;
}

/* ═══ MIDI EXPORT ═══ */
function exportMidi(){
if(!device||!device.song)return;
try{
var notes=[];
var bpm=device.bpm||145;
var ticksPerBeat=480;
var absStep=0;
var totalSteps=device.song.totalBars*16;
for(var s=0;s<Math.min(totalSteps,256);s++){
var info=typeof sectionAt==="function"?sectionAt(device.song,Math.floor(s/16)):null;
if(!info)continue;
/* add kick notes */
if(s%4===0){
notes.push({time:s*ticksPerBeat/4,pitch:36,dur:ticksPerBeat/8,vel:100});
}
/* add bass notes */
if(s%2===0){
var bassNote=36+((s/2)%12);
notes.push({time:s*ticksPerBeat/4,pitch:bassNote,dur:ticksPerBeat/8,vel:80});
}
}
/* build MIDI file */
var midi=buildMidiFile(notes,bpm,ticksPerBeat);
var blob=new Blob([midi],{type:"audio/midi"});
var url=URL.createObjectURL(blob);
var a=document.createElement("a");
a.href=url;
a.download="psy6_export.mid";
a.click();
URL.revokeObjectURL(url);
var st=$("status");
if(st)st.textContent="MIDI exported: "+notes.length+" notes";
if(navigator.vibrate)navigator.vibrate([10,30,10]);
}catch(e){
var st2=$("status");
if(st2)st2.textContent="MIDI export failed";
}
}
function buildMidiFile(notes,bpm,tpb){
/* minimal MIDI file builder */
var data=[];
/* header: MThd */
data.push(0x4D,0x54,0x68,0x64);
data.push(0,0,0,6);
data.push(0,0); /* format 0 */
data.push(0,1); /* 1 track */
data.push((tpb>>8)&0xFF,tpb&0xFF);
/* track: MTrk */
var track=[];
/* tempo */
var usPerBeat=Math.round(60000000/bpm);
track.push(0x00,0xFF,0x51,0x03,(usPerBeat>>16)&0xFF,(usPerBeat>>8)&0xFF,usPerBeat&0xFF);
/* notes */
var lastTime=0;
notes.sort(function(a,b){return a.time-b.time;});
for(var i=0;i<notes.length;i++){
var n=notes[i];
var delta=n.time-lastTime;
/* note on */
track.push(encodeVarLen(delta),0x90,n.pitch,n.vel);
/* note off */
track.push(encodeVarLen(n.dur),0x80,n.pitch,0);
lastTime=n.time+n.dur;
}
/* end of track */
track.push(0x00,0xFF,0x2F,0x00);
/* track header */
data.push(0x4D,0x54,0x72,0x6B);
data.push((track.length>>24)&0xFF,(track.length>>16)&0xFF,(track.length>>8)&0xFF,track.length&0xFF);
data=data.concat(track);
return new Uint8Array(data);
}
function encodeVarLen(val){
var bytes=[];
bytes.push(val&0x7F);
val>>=7;
while(val>0){
bytes.push((val&0x7F)|0x80);
val>>=7;
}
bytes.reverse();
return bytes;
}

var perfFrames=0,perfLast=performance.now(),perfFps=60;

perfFrames++;

if(now-perfLast>=1000){

var latency=device.ctx?Math.round(device.ctx.baseLatency*1000):0;

/* ═══ URL SHARING ═══ */
function encodePresetUrl(){
try{
var preset={b:device.bpm,s:STYLE.scale,g:STYLE.name};
var encoded=btoa(JSON.stringify(preset));
var url=location.origin+location.pathname+"#p="+encoded;
if(navigator.clipboard){navigator.clipboard.writeText(url).catch(function(){});}
return url;
}catch(e){return "";}
}
function decodePresetUrl(){
try{
var hash=location.hash;
if(hash&&hash.indexOf("#p=")===0){
var encoded=hash.substring(3);
var preset=JSON.parse(atob(encoded));
if(preset.b)device.setKnob("bpm",preset.b);
if(preset.s&&SCALES[preset.s]){
STYLE.scale=preset.s;SCALE=SCALES[preset.s];
SCALE_EXT=(function(){var a=[],i;for(i=0;i<SCALE.length;i++)a.push(SCALE[i]);for(i=0;i<SCALE.length;i++)a.push(SCALE[i]+12);a.push(24);return a;})();
}
if(preset.g)STYLE.name=preset.g;
device.variate(false);
}
}catch(e){}
}

/* ═══ ADAPTIVE STATE MACHINE ═══ */
function adaptUpdate(){
if(!device||!device.isPlaying)return;
var info=typeof sectionAt==="function"?sectionAt(device.song,Math.floor(device.absStep/16)):null;
if(info){
var sec=info.section;
if(sec.name==="INTRO"||sec.name==="BREAK")adaptState.target=0.3;
else if(sec.name==="BUILD"||sec.name==="RISER")adaptState.target=0.6;
else if(sec.name==="DROP"||sec.name==="DROP2")adaptState.target=1.0;
else adaptState.target=0.5;
}
adaptState.energy+=(adaptState.target-adaptState.energy)*0.02;
/* modulate drive based on energy */
if(device.drivePre&&device.ctx){
var baseDrive=device.knobs?device.knobs.drive:0.5;
device.drivePre.gain.setTargetAtTime(baseDrive*(0.7+adaptState.energy*0.6),device.ctx.currentTime,0.1);
}
}
adaptState.timer=setInterval(adaptUpdate,200);

/* ═══ FX FINE CONTROLS ═══ */
document.addEventListener("keydown",function(e){
if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
var k=(e.key||"").toLowerCase();if(typeof KEYMAP!=="undefined"&&k in KEYMAP)return;
if(e.key==="["||e.key==="]"){
/* [ = decrease delay, ] = increase delay */
var cur=device.knobs?device.knobs.delay:0.5;
var step=e.key==="["?-0.05:0.05;
var newVal=Math.max(0,Math.min(1,cur+step));
device.setKnob("delay",newVal);

}
else if(e.key===";"||e.key==="'"){
/* ; = decrease reverb, ' = increase reverb */
var cur2=device.knobs?device.knobs.reverb:0.5;
var step2=e.key===";"?-0.05:0.05;
var newVal2=Math.max(0,Math.min(1,cur2+step2));
device.setKnob("reverb",newVal2);
if(navigator.vibrate)navigator.vibrate(3);
}
});

/* ═══ MIDI SUPPORT ═══ */
if(navigator.requestMIDIAccess){
navigator.requestMIDIAccess().then(function(midi){
function onMidiMsg(e){
var data=e.data;
if(!data||data.length<1)return;
/* MIDI Clock (0xF8) - single byte message */
if(data[0]===0xF8){
if(typeof handleMidiClock==="function")handleMidiClock(0xF8,0,0);
return;
}
/* MIDI Start (0xFA) */
if(data[0]===0xFA){
if(device&&!device.isPlaying)togglePlay();
return;
}
/* MIDI Stop (0xFC) */
if(data[0]===0xFC){
if(device&&device.isPlaying)togglePlay();
return;
}
if(data.length<3)return;
var cmd=data[0]&0xf0;
var note=data[1];
var vel=data[2];
if(cmd===0x90&&vel>0){
/* note on → trigger pad */
var padIdx=note%8;
if(typeof hitPad==="function")hitPad(padIdx);
if(navigator.vibrate)navigator.vibrate(5);
}
else if(cmd===0xB0){
/* CC → map to knobs */
var cc=data[0]&0x0f;
var val=data[2]/127;
if(cc===1)device.setKnob("filter",val);
else if(cc===2)device.setKnob("res",val);
else if(cc===3)device.setKnob("drive",val);
else if(cc===4)device.setKnob("delay",val);
else if(cc===5)device.setKnob("reverb",val);
else if(cc===6)device.setKnob("swing",val);
}
}
midi.inputs.forEach(function(input){
input.onmidimessage=onMidiMsg;
});
var status=$("status");
if(status)status.textContent+="  MIDI: "+midi.inputs.size+" device(s)";
}).catch(function(){});
}

/* ═══ WAVEFORM OVERLAY ═══ */
var waveData=new Uint8Array(256);
var origVizRender=null;
function renderWaveform(){
if(!device||!device.analyser||!device.isPlaying)return;
var canvas=$("viz");
if(!canvas)return;
var ctx=canvas.getContext("2d");
var w=canvas.width,h=canvas.height;
device.analyser.getByteTimeDomainData(waveData);
ctx.strokeStyle="rgba(255,46,136,0.6)";
ctx.lineWidth=1.5;
ctx.beginPath();
for(var i=0;i<waveData.length;i++){
var x=i/waveData.length*w;
var y=h/2+(waveData[i]-128)/128*h*0.4;
if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
}
ctx.stroke();
}
/* hook into existing render loop */
var _origRAF=window.requestAnimationFrame;
var waveActive=false;
setInterval(function(){
if(device&&device.isPlaying&&!waveActive){
waveActive=true;
(function waveLoop(){
if(!device||!device.isPlaying){waveActive=false;return;}
renderWaveform();
requestAnimationFrame(waveLoop);
})();
}
},500);

/* ═══ SPECTRUM VISUALIZER ═══ */
var specCanvas=$("specCanvas");
var specCtx=specCanvas?specCanvas.getContext("2d"):null;
var specData=new Uint8Array(128);
function renderSpectrum(){
if(!specCtx||!device||!device.analyser)return;
requestAnimationFrame(renderSpectrum);
var w=specCanvas.width=specCanvas.clientWidth*devicePixelRatio;
var h=specCanvas.height=60*devicePixelRatio;
device.analyser.getByteFrequencyData(specData);
specCtx.clearRect(0,0,w,h);
var bars=64;
var bw=w/bars;
for(var i=0;i<bars;i++){
var val=specData[Math.floor(i*specData.length/bars)]/255;
var bh=Math.max(1,val*h*0.9);
var hue=170+i*2.5;
specCtx.fillStyle="hsla("+hue+",100%,"+(45+val*25)+"%,"+(0.4+val*0.6)+")";
specCtx.fillRect(i*bw+1,h-bh,bw-2,bh);
}
}
if(specCanvas){requestAnimationFrame(renderSpectrum);}

/* ═══ RECORDING ═══ */
var mediaRec=null,recChunks=[],recStart=0,recTimer=null;
var recBtn=$("recBtn"),dlBtn=$("dlBtn"),recTime=$("recTime");
if(recBtn){
recBtn.addEventListener("click",function(){
if(!device||!device.ctx)return;
if(!mediaRec){
/* start recording */
if(!device.ctx)return;
var dest=device.ctx.createMediaStreamDestination();
device.master.connect(dest);
var mime="audio/webm";
if(!MediaRecorder.isTypeSupported(mime))mime="audio/ogg";
mediaRec=new MediaRecorder(dest.stream,{mimeType:mime});
recChunks=[];
mediaRec.ondataavailable=function(e){if(e.data.size>0)recChunks.push(e.data);};
mediaRec.onstop=function(){
var blob=new Blob(recChunks,{type:mediaRec.mimeType});
var url=URL.createObjectURL(blob);
if(dlBtn){dlBtn.style.display="inline-block";dlBtn.onclick=function(){
var a=document.createElement("a");a.href=url;a.download="psy6_"+Date.now()+".webm";a.click();};}
};
mediaRec.start(100);
recStart=Date.now();
recBtn.classList.add("recording");
recBtn.innerHTML="&#9632; STOP";
recTimer=setInterval(function(){
var s=Math.floor((Date.now()-recStart)/1000);
if(recTime)recTime.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
},500);
if(navigator.vibrate)navigator.vibrate([10,50,10]);
}else{
/* stop recording */
mediaRec.stop();
mediaRec=null;
recBtn.classList.remove("recording");
recBtn.innerHTML="&#9679; REC";
if(recTimer){clearInterval(recTimer);recTimer=null;}
if(navigator.vibrate)navigator.vibrate([10,50,10]);
}
});
}

STYLE.scale=newScale;
SCALE=SCALES[newScale];
SCALE_EXT=(function(){var a=[],i;for(i=0;i<SCALE.length;i++)a.push(SCALE[i]);for(i=0;i<SCALE.length;i++)a.push(SCALE[i]+12);a.push(24);return a;})();
device.variate(false);
if(navigator.vibrate)navigator.vibrate(10);
}
});
}
/* ═══ GENRE SELECTOR ═══ */
var genreSelect=$("genreSelect");
if(genreSelect){
genreSelect.addEventListener("change",function(){
var g=this.value;
STYLE.name=g;
if(g==="DARK-PSY"){STYLE.leadDensity=0.5;STYLE.glideChance=0.4;STYLE.bassOctaveChance=0.2;STYLE.bassPassingChance=0.25;}
else if(g==="PROGRESSIVE"){STYLE.leadDensity=0.4;STYLE.glideChance=0.2;STYLE.bassOctaveChance=0.4;STYLE.bassPassingChance=0.1;}
else if(g==="GOA"){STYLE.leadDensity=0.8;STYLE.glideChance=0.35;STYLE.bassOctaveChance=0.25;STYLE.bassPassingChance=0.2;}
else if(g==="TECHNO"){STYLE.leadDensity=0.3;STYLE.glideChance=0.1;STYLE.bassOctaveChance=0.5;STYLE.bassPassingChance=0.15;}
else{STYLE.leadDensity=0.7;STYLE.glideChance=0.3;STYLE.bassOctaveChance=0.3;STYLE.bassPassingChance=0.18;}
device.variate(false);
if(navigator.vibrate)navigator.vibrate(10);
});
}
/* ═══ BPM TAP ═══ */
var tapTimes=[];
var tapBtn=$("tapBtn");
if(tapBtn){
tapBtn.addEventListener("click",function(){
var now=performance.now();
tapTimes.push(now);
if(tapTimes.length>8)tapTimes.shift();
if(tapTimes.length>=2){
var intervals=[];
for(var i=1;i<tapTimes.length;i++)intervals.push(tapTimes[i]-tapTimes[i-1]);
var avg=intervals.reduce(function(a,b){return a+b;},0)/intervals.length;
var bpm=Math.round(60000/avg);
if(bpm>=60&&bpm<=200){
device.setKnob("bpm",bpm);
if(navigator.vibrate)navigator.vibrate(5);
}
}
if(tapTimes.length>=2&&tapTimes[tapTimes.length-1]-tapTimes[tapTimes.length-2]>2000){
tapTimes=[now];
}
});
}

/* ═══ XY PAD ═══ */
var xyPad=$("xyPad"),xyDot=$("xyDot"),xyActive=false;
function xyUpdate(x,y){
if(!xyPad)return;
var r=xyPad.getBoundingClientRect();
var nx=Math.max(0,Math.min(1,(x-r.left)/r.width));
var ny=Math.max(0,Math.min(1,1-(y-r.top)/r.height));
if(xyDot){xyDot.style.left=(nx*100)+"%";xyDot.style.top=((1-ny)*100)+"%";}
var info=$("xyInfo");
if(info)info.textContent="CUT: "+Math.round(100*Math.pow(80,nx))+"Hz  RES: "+(1+ny*20).toFixed(1);
if(device&&device.ctx&&device.autoFilter){
device.autoFilter.frequency.setTargetAtTime(100*Math.pow(80,nx),device.ctx.currentTime,0.05);
device.autoFilter.Q.setTargetAtTime(1+ny*20,device.ctx.currentTime,0.05);
}
}
if(xyPad){
xyPad.addEventListener("pointerdown",function(e){xyActive=true;xyPad.setPointerCapture(e.pointerId);xyUpdate(e.clientX,e.clientY);});
xyPad.addEventListener("pointermove",function(e){if(xyActive)xyUpdate(e.clientX,e.clientY);});
xyPad.addEventListener("pointerup",function(){xyActive=false;});
xyPad.addEventListener("pointercancel",function(){xyActive=false;});
}
</script>
