<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSY3 - Commercial Trance Engine</title>
<style>
body{font-family:system-ui;background:#05080c;color:#eef;padding:20px;text-align:center}
h1{color:#d4ff3f;text-shadow:0 0 16px #d4ff3f;font-size:24px}
#play{font-size:20px;padding:14px 44px;border-radius:14px;border:2px solid #d4ff3f;background:#131a10;color:#d4ff3f;cursor:pointer}
#play:hover{background:#d4ff3f;color:#000}
#status{color:#888;margin-top:10px;font-size:12px}
#state{font-size:32px;margin-top:15px;font-weight:bold;transition:color 0.5s}
#energy-bar{width:300px;height:8px;background:#222;margin:10px auto;border-radius:4px;overflow:hidden}
#energy-fill{height:100%;background:linear-gradient(90deg,#d4ff3f,#ff6b35,#ff2e63);width:0%;transition:width 0.3s}
#info{color:#666;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<h1>PSY3</h1>
<button id="play">PLAY &#9654;</button>
<p id="status">commercial psytrance engine</p>
<div id="state"></div>
<div id="energy-bar"><div id="energy-fill"></div></div>
<div id="info"></div>
<script>
"use strict";
const eng={ctx:null,
init(){if(this.ctx)return;const c=new(window.AudioContext||window.webkitAudioContext)();this.ctx=c;
// Master chain: gentle compression, NOT aggressive
this.sum=c.createGain();this.sum.gain.value=0.75;
this.duck=c.createGain(); // Sidechain bus
this.comp=c.createDynamicsCompressor();
this.comp.threshold.value=-12;this.comp.ratio.value=2.5;
this.comp.attack.value=0.005;this.comp.release.value=0.12;
this.lim=c.createDynamicsCompressor();
this.lim.threshold.value=-1;this.lim.ratio.value=12;
this.lim.attack.value=0.001;this.lim.release.value=0.08;
this.master=c.createGain();this.master.gain.value=0.8;
this.sum.connect(this.duck);this.duck.connect(this.comp);
this.comp.connect(this.lim);this.lim.connect(this.master);
this.master.connect(c.destination);
// Delay: dotted 8th (3/16 at 142bpm = 0.317s)
this.dSend=c.createGain();this.dSend.gain.value=0.3;
this.dl=c.createDelay(2);this.dl.delayTime.value=0.317;
this.dlF=c.createBiquadFilter();this.dlF.type="lowpass";this.dlF.frequency.value=2800;
this.dlHP=c.createBiquadFilter();this.dlHP.type="highpass";this.dlHP.frequency.value=300;
this.fb=c.createGain();this.fb.gain.value=0.3;
this.dSend.connect(this.dl);this.dl.connect(this.dlF);
this.dlF.connect(this.dlHP);this.dlHP.connect(this.fb);
this.fb.connect(this.dl);this.dlF.connect(this.sum);
// Reverb: short, clean (1.2s decay)
this.rSend=c.createGain();this.rSend.gain.value=0.25;
this.rev=c.createConvolver();
const ir=c.createBuffer(2,c.sampleRate*1.2,c.sampleRate);
for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);
for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);}}
this.rev.buffer=ir;this.revG=c.createGain();this.revG.gain.value=0.2;
this.rSend.connect(this.rev);this.rev.connect(this.revG);this.revG.connect(this.sum);},

// KICK: tight, short, punchy (psytrance style)
kick(t,a){a=a||1;const c=this.ctx;
// Sub: 50Hz sine, very short
const sub=c.createOscillator(),subG=c.createGain();
sub.type="sine";
sub.frequency.setValueAtTime(52,t);
sub.frequency.exponentialRampToValueAtTime(42,t+0.06);
subG.gain.setValueAtTime(0.8*a,t);
subG.gain.exponentialRampToValueAtTime(0.001,t+0.18);
sub.connect(subG);subG.connect(this.sum);
sub.start(t);sub.stop(t+0.2);
// Body: 150->45Hz, punch
const body=c.createOscillator(),bodyG=c.createGain();
body.type="sine";
body.frequency.setValueAtTime(150,t);
body.frequency.exponentialRampToValueAtTime(45,t+0.007);
bodyG.gain.setValueAtTime(0.5*a,t);
bodyG.gain.exponentialRampToValueAtTime(0.001,t+0.12);
body.connect(bodyG);bodyG.connect(this.sum);
body.start(t);body.stop(t+0.15);
// Click: very short, subtle
const click=c.createOscillator(),clickG=c.createGain();
click.type="triangle";
click.frequency.setValueAtTime(800,t);
click.frequency.exponentialRampToValueAtTime(300,t+0.008);
clickG.gain.setValueAtTime(0.12*a,t);
clickG.gain.exponentialRampToValueAtTime(0.001,t+0.015);
click.connect(clickG);clickG.connect(this.sum);
click.start(t);click.stop(t+0.02);
// Sidechain: duck bass when kick hits
if(this.duck){const d=this.duck.gain;
d.cancelScheduledValues(t);
d.setValueAtTime(0.3,t);
d.setTargetAtTime(1,t+0.04,0.06);}},

// BASS: offbeat, short, rolling (psytrance style)
bass(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
// Main: square wave, tight
const o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
o.type="square";o.frequency.value=f;
// Filter: fast envelope, opens then closes quickly
fl.type="lowpass";
fl.frequency.setValueAtTime(1800,t);
fl.frequency.exponentialRampToValueAtTime(250,t+dur*0.6);
fl.Q.value=2;
g.gain.setValueAtTime(0.3,t);
g.gain.setValueAtTime(0.3,t+dur*0.5);
g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.8);
o.connect(fl);fl.connect(g);g.connect(this.sum);
o.start(t);o.stop(t+dur);
// Sub octave: adds weight
const sub=c.createOscillator(),subG=c.createGain();
sub.type="sine";sub.frequency.value=f/2;
subG.gain.setValueAtTime(0.15,t);
subG.gain.exponentialRampToValueAtTime(0.001,t+dur*0.7);
sub.connect(subG);subG.connect(this.sum);
sub.start(t);sub.stop(t+dur);},

// LEAD: sawtooth, filter envelope, resonance (psytrance lead)
lead(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),o2=c.createOscillator();
const g=c.createGain(),fl=c.createBiquadFilter();
o.type="sawtooth";o.frequency.value=f;
o2.type="sawtooth";o2.frequency.value=f*1.003; // slight detune
// Filter: opens wide then closes
fl.type="lowpass";
fl.frequency.setValueAtTime(5000,t);
fl.frequency.exponentialRampToValueAtTime(800,t+dur);
fl.Q.value=5; // resonance for that psytrance "squelch"
g.gain.setValueAtTime(0.001,t);
g.gain.linearRampToValueAtTime(0.09,t+0.01);
g.gain.setValueAtTime(0.09,t+dur*0.5);
g.gain.exponentialRampToValueAtTime(0.001,t+dur);
o.connect(fl);o2.connect(fl);fl.connect(g);
g.connect(this.sum);g.connect(this.dSend); // send to delay
o.start(t);o2.start(t);
o.stop(t+dur+0.02);o2.stop(t+dur+0.02);},

// PAD: warm, wide, slow attack
pad(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),o2=c.createOscillator(),o3=c.createOscillator();
const g=c.createGain(),fl=c.createBiquadFilter();
o.type="sawtooth";o.frequency.value=f;
o2.type="sawtooth";o2.frequency.value=f*1.005;
o3.type="sawtooth";o3.frequency.value=f*0.995;
fl.type="lowpass";fl.frequency.value=800;fl.Q.value=0.7;
g.gain.setValueAtTime(0.001,t);
g.gain.linearRampToValueAtTime(0.04,t+dur*0.5);
g.gain.setValueAtTime(0.04,t+dur*0.7);
g.gain.linearRampToValueAtTime(0.001,t+dur);
o.connect(fl);o2.connect(fl);o3.connect(fl);fl.connect(g);
g.connect(this.sum);g.connect(this.rSend); // send to reverb
o.start(t);o2.start(t);o3.start(t);
o.stop(t+dur+0.1);o2.stop(t+dur+0.1);o3.stop(t+dur+0.1);},

// HAT: crisp, short
hat(t,open,v){v=v||0.12;const c=this.ctx,dur=open?0.15:0.035;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,open?2:4);
const s=c.createBufferSource();s.buffer=buf;
const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=9000;
const g=c.createGain();g.gain.value=v;
s.connect(hp);hp.connect(g);g.connect(this.sum);s.start(t);},

// CLAP: layered, tight
clap(t){const c=this.ctx;
for(let i=0;i<3;i++){const dur=0.05;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
const d=buf.getChannelData(0);
for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
const s=c.createBufferSource();s.buffer=buf;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1200+i*300;bp.Q.value=2;
const g=c.createGain();
g.gain.setValueAtTime(0.001,t+i*0.01);
g.gain.exponentialRampToValueAtTime(0.18,t+i*0.01+dur);
s.connect(bp);bp.connect(g);g.connect(this.sum);
s.start(t+i*0.01);s.stop(t+i*0.01+dur+0.05);}},

// RISER: builds tension
riser(t,dur){dur=dur||1.5;const c=this.ctx;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);
const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(i/d.length);
const s=c.createBufferSource();s.buffer=buf;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.Q.value=4;
bp.frequency.setValueAtTime(200,t);
bp.frequency.exponentialRampToValueAtTime(7000,t+dur);
const g=c.createGain();
g.gain.setValueAtTime(0.001,t);
g.gain.exponentialRampToValueAtTime(0.25,t+dur);
s.connect(bp);bp.connect(g);g.connect(this.sum);
s.start(t);s.stop(t+dur+0.05);},

// IMPACT: drop moment
impact(t){const c=this.ctx;
const o=c.createOscillator(),g=c.createGain();
o.type="sine";
o.frequency.setValueAtTime(80,t);
o.frequency.exponentialRampToValueAtTime(30,t+0.4);
g.gain.setValueAtTime(0.7,t);
g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
o.connect(g);g.connect(this.sum);
o.start(t);o.stop(t+0.55);}};

// === ADAPTIVE INTELLIGENCE ===
const SCALES={PHRY:[0,1,3,5,7,8,10]};
const STATES={
CALM:{energy:0.2,density:0.3,complexity:0.2,color:'#4ecdc4'},
GROOVE:{energy:0.5,density:0.6,complexity:0.5,color:'#d4ff3f'},
TENSION:{energy:0.7,density:0.7,complexity:0.7,color:'#ff6b35'},
PEAK:{energy:1.0,density:1.0,complexity:1.0,color:'#ff2e63'},
RELEASE:{energy:0.3,density:0.4,complexity:0.3,color:'#a8e6cf'}};
const TRANSITIONS={
CALM:{CALM:0.2,GROOVE:0.5,TENSION:0.2,PEAK:0.0,RELEASE:0.1},
GROOVE:{CALM:0.1,GROOVE:0.3,TENSION:0.4,PEAK:0.1,RELEASE:0.1},
TENSION:{CALM:0.0,GROOVE:0.2,TENSION:0.2,PEAK:0.5,RELEASE:0.1},
PEAK:{CALM:0.0,GROOVE:0.1,TENSION:0.1,PEAK:0.3,RELEASE:0.5},
RELEASE:{CALM:0.5,GROOVE:0.3,TENSION:0.1,PEAK:0.0,RELEASE:0.1}};

const mind={state:'CALM',energy:0.2,targetEnergy:0.2,memory:[],motif:[],bar:0,lastTransition:0,minBarsInState:4,
init(seed){this.state='CALM';this.energy=0.2;this.targetEnergy=0.2;this.memory=[];
this.motif=this.genMotif(seed);this.bar=0;this.lastTransition=0;},
genMotif(seed){const m=[];let v=0;
for(let i=0;i<32;i++){v=(v+seed+i*3)%7;m.push(v);}return m;},
evolveMotif(){for(let i=0;i<32;i++){
if(Math.random()<0.1){const delta=Math.floor(Math.random()*3)-1;
this.motif[i]=(this.motif[i]+delta+7)%7;}}},
chooseNextState(){
if(this.bar-this.lastTransition<this.minBarsInState)return this.state;
const probs=TRANSITIONS[this.state];const r=Math.random();let cum=0;
for(const[next,p]of Object.entries(probs)){cum+=p;
if(r<cum){const recent=this.memory.slice(-4);
const count=recent.filter(s=>s===next).length;
if(count>=2&&Math.random()<0.5)continue;return next;}}
return this.state;},
transition(){const next=this.chooseNextState();
if(next!==this.state){this.memory.push(this.state);
if(this.memory.length>16)this.memory.shift();
this.state=next;this.targetEnergy=STATES[next].energy;
this.lastTransition=this.bar;
if(next==='TENSION')eng.riser(eng.ctx.currentTime,1.5);
if(next==='PEAK')eng.impact(eng.ctx.currentTime);}},
update(){this.energy+=(this.targetEnergy-this.energy)*0.05;
if(this.bar%8===0)this.evolveMotif();
if(this.bar%2===0)this.transition();}};

// === SEQUENCER (low latency) ===
const seq={playing:false,timer:null,next:0,si:0,bpm:142,
start(){eng.init();if(eng.ctx.state==='suspended')eng.ctx.resume();
if(this.playing)return;this.playing=true;this.si=0;
mind.init(7);
this.next=eng.ctx.currentTime+0.05; // minimal lookahead
this.timer=setInterval(()=>this.tick(),15);}, // 15ms timer for lower latency
stop(){this.playing=false;clearInterval(this.timer);},
s16(){return 60/this.bpm/4;},
tick(){while(this.next<eng.ctx.currentTime+0.08){ // 80ms lookahead
this.step(this.si,this.next);this.si=(this.si+1)%32;
if(this.si===0){mind.bar++;mind.update();}
this.next+=this.s16();}},
step(s,t){const st=STATES[mind.state];const sc=SCALES.PHRY;
const root=45;const e=mind.energy;
document.getElementById('state').textContent=mind.state;
document.getElementById('state').style.color=st.color;
document.getElementById('energy-fill').style.width=(e*100)+'%';
document.getElementById('info').textContent='energy: '+e.toFixed(2)+' | bar: '+mind.bar+' | bpm: '+this.bpm;
// KICK: every 4 steps (four-on-the-floor)
if(s%4===0)eng.kick(t,0.4+e*0.6);
// BASS: offbeat (every odd step), rolling
if(s%2===1&&Math.random()<st.density){
const note=root+sc[mind.motif[s]%sc.length]-12;
eng.bass(t,note,this.s16()*0.7);}
// LEAD: sparse, follows motif
if(s%4===2&&Math.random()<st.complexity*e*0.7){
const note=root+12+sc[mind.motif[s]%sc.length];
eng.lead(t,note,this.s16()*1.2);}
// PAD: only in calm/release
if(s===0&&(mind.state==='CALM'||mind.state==='RELEASE')){
eng.pad(t,root+sc[mind.motif[0]%sc.length],this.s16()*16);}
// HATS: steady, energy-dependent
if(s%2===0&&Math.random()<0.4+e*0.6)
eng.hat(t,s%8===6,0.06+e*0.08);
// CLAP: on beat 2 and 4
if(s%8===4&&st.density>0.5)eng.clap(t);}};

function toggle(){
if(seq.playing){seq.stop();
document.getElementById('play').textContent='PLAY \u25B6';
document.getElementById('status').textContent='Stopped';}
else{seq.start();
document.getElementById('play').textContent='\u25A0 STOP';
document.getElementById('status').textContent='commercial psytrance engine';}}
document.getElementById('play').addEventListener('click',toggle);
</script>
</body>
</html>
