<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSY3 PRO — Hyperspace Psytrance Workstation</title>
<style>
/* ══════════════════════════════════════════════════════════
   PSY3 PRO — Professional Design System
   ══════════════════════════════════════════════════════════ */

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #0a0c12;
  --bg-secondary: #06080c;
  --panel-primary: #1a1d26;
  --panel-secondary: #12141c;
  --panel-tertiary: #0d0f16;
  --accent-orange: #ffb454;
  --accent-cyan: #3fa9bc;
  --accent-green: #b8e05a;
  --accent-yellow: #fbbf24;
  --accent-purple: #c084fc;
  --accent-blue: #60a5fa;
  --accent-red: #f87171;
  --text-primary: #e8e8f0;
  --text-secondary: #a0a8b8;
  --text-dim: #666;
  --border-dark: #000;
  --border-light: rgba(255,255,255,0.06);
  --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Consolas', 'Monaco', monospace;
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 18px;
}

body {
  font-family: var(--font-ui);
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(96, 60, 180, 0.2) 0%, transparent 60%),
    radial-gradient(1000px 600px at 80% 110%, rgba(20, 120, 130, 0.15) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
  color: var(--text-primary);
}

/* ══════════ CHASSIS ══════════ */
.chassis {
  position: relative;
  width: min(1280px, 100%);
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, #282c36 0%, #1c2028 12%, var(--panel-secondary) 55%, var(--panel-tertiary) 100%);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-dark);
  padding: 28px 52px 32px;
  box-shadow:
    0 50px 100px rgba(0,0,0,0.8),
    0 0 0 1px rgba(255,255,255,0.05) inset,
    0 2px 0 rgba(255,255,255,0.06) inset,
    0 -4px 0 rgba(0,0,0,0.7) inset;
}

/* Wood cheeks */
.cheek {
  position: absolute;
  top: -8px;
  bottom: -8px;
  width: 38px;
  border-radius: 12px;
  background:
    repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 6px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 14px),
    linear-gradient(90deg, #4d3117, #7a4f28 28%, #5d3c1c 72%, #3d2611);
  box-shadow:
    inset 0 2px 6px rgba(255,255,255,0.2),
    inset 0 -6px 12px rgba(0,0,0,0.6),
    0 16px 36px rgba(0,0,0,0.7);
}
.cheek.l { left: -44px; }
.cheek.r { right: -44px; }

/* Corner screws */
.screw {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #a0a8b2, #4a5260 55%, #181c22);
  box-shadow: 0 1px 4px rgba(0,0,0,0.9), inset 0 1px 2px rgba(255,255,255,0.35);
}
.screw::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 9px;
  height: 1.5px;
  background: #1a1e24;
  transform: translate(-50%, -50%) rotate(45deg);
}

/* ══════════ HEADER ══════════ */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-lg);
  padding-bottom: var(--space-md);
  border-bottom: 1px solid var(--border-light);
}

.logo {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--accent-orange);
  text-shadow: 0 0 20px rgba(255,180,84,0.4);
}

.logo span {
  color: var(--accent-cyan);
  font-size: 14px;
  margin-left: var(--space-sm);
  letter-spacing: 2px;
}

.subtitle {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-secondary);
}

/* ══════════ STATUS ══════════ */
.status {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
  margin-bottom: var(--space-md);
}

.status.err {
  color: var(--accent-red);
}

/* ══════════ TRANSPORT ══════════ */
.transport {
  display: flex;
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}

.play-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 12px 24px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-dark);
  background: linear-gradient(180deg, #2e3340, #1e222c);
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}

.play-btn:hover {
  background: linear-gradient(180deg, #3a4050, #2e3340);
  transform: translateY(-1px);
}

.play-btn:active {
  transform: translateY(1px);
}

/* ══════════ DISPLAY ══════════ */
.display {
  background: linear-gradient(180deg, #0a0c12, #06080c);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-dark);
  padding: var(--space-md);
  font-family: var(--font-mono);
  color: var(--accent-green);
  box-shadow:
    0 0 24px rgba(184,224,90,0.12) inset,
    0 6px 16px rgba(0,0,0,0.6);
  margin-bottom: var(--space-md);
}

.lcd-line {
  font-size: 14px;
  margin-bottom: 4px;
}

.lcd-steps {
  display: flex;
  gap: 4px;
  margin-top: 8px;
}

.lcd-steps .ls {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  background: #333;
}

.lcd-steps .ls.on {
  background: var(--accent-green);
  box-shadow: 0 0 6px var(--accent-green);
}

/* ══════════ KNOBS ══════════ */
.knobs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-md);
  margin-bottom: var(--space-md);
}

.knob {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-xs);
}

.knob-dial {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #3a3f48, #1a1d22 60%),
    linear-gradient(180deg, #2a2e36, #14171c);
  border: 2px solid var(--border-dark);
  box-shadow:
    0 2px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.05) inset;
  position: relative;
  cursor: pointer;
}

.knob-ind {
  position: absolute;
  top: 4px;
  left: 50%;
  width: 3px;
  height: 12px;
  background: var(--accent-orange);
  border-radius: 2px;
  transform-origin: bottom center;
  box-shadow: 0 0 6px var(--accent-orange);
}

.knob-name {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-secondary);
}

.knob-val {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent-cyan);
}

/* ══════════ SEQUENCER ══════════ */
.seq {
  margin-bottom: var(--space-md);
}

.seq-row {
  display: flex;
  align-items: center;
  gap: var(--space-xs);
  margin-bottom: var(--space-xs);
}

.mute {
  font-family: var(--font-mono);
  font-size: 9px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-dark);
  background: linear-gradient(180deg, #2e3340, #1e222c);
  color: var(--text-primary);
  cursor: pointer;
}

.mute.muted {
  background: var(--accent-red);
  color: var(--border-dark);
}

.seq-step {
  width: 24px;
  height: 24px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2a2e36, #1a1d22);
  border: 1px solid var(--border-dark);
  cursor: pointer;
}

.seq-step.on {
  background: var(--accent-orange);
  box-shadow: 0 0 6px var(--accent-orange);
}

/* ══════════ PADS ══════════ */
.pads {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--space-sm);
  margin-bottom: var(--space-md);
}

.pad {
  aspect-ratio: 1;
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, #2a2e36, #1a1d22);
  border: 1px solid var(--border-dark);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--text-primary);
  transition: all 0.1s;
}

.pad.hit {
  background: var(--accent-purple);
  box-shadow: 0 0 16px rgba(192,132,252,0.5);
}

/* ══════════ TIMELINE ══════════ */
.timeline {
  display: flex;
  gap: 2px;
  margin-bottom: var(--space-md);
}

.tl-sec {
  height: 24px;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #2a2e36, #1a1d22);
  border: 1px solid var(--border-dark);
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ══════════ VIZ ══════════ */
.viz {
  width: 100%;
  height: 60px;
  background: linear-gradient(180deg, #0a0c12, #06080c);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-dark);
  margin-bottom: var(--space-md);
}

/* ══════════ SELF TEST ══════════ */
.self-test {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-secondary);
}

.self-test.err {
  color: var(--accent-red);
}

/* ══════════ RESPONSIVE ══════════ */
@media (max-width: 768px) {
  body { padding: 16px 8px; }
  .chassis { padding: 18px 28px; }
  .cheek { display: none; }
}

@media (max-width: 480px) {
  .chassis { padding: 14px 18px; }
}
</style>
</head>
<body>
<div class="chassis">
  <div class="cheek l"></div>
  <div class="cheek r"></div>
  <div class="screw" style="top:12px;left:12px"></div>
  <div class="screw" style="top:12px;right:12px"></div>
  <div class="screw" style="bottom:12px;left:12px"></div>
  <div class="screw" style="bottom:12px;right:12px"></div>
  
  <header class="topbar">
    <div class="logo">PSY3<span>PRO</span></div>
    <div class="subtitle">Hyperspace Psytrance Workstation</div>
  </header>
  
  <div id="status" class="status">READY</div>
  
  <div class="transport">
    <button id="playBtn" class="play-btn">PLAY</button>
    <button id="variateBtn" class="play-btn">VARIATE</button>
    <button id="nextSecBtn" class="play-btn">NEXT SEC</button>
    <span id="engState" class="status">stopped</span>
  </div>
  
  <div class="display">
    <div id="lcd1" class="lcd-line">READY</div>
    <div id="lcd2" class="lcd-line">PSY3 PRO</div>
    <div id="nowPlaying" class="lcd-line"></div>
    <div id="lcdSteps" class="lcd-steps"></div>
  </div>
  
  <div id="knobs" class="knobs"></div>
  
  <div id="seq" class="seq"></div>
  
  <div id="pads" class="pads"></div>
  
  <div id="timeline" class="timeline"></div>
  
  <canvas id="viz" class="viz"></canvas>
  
  <div id="selfTest" class="self-test">SELF TEST: PENDING</div>
</div>

<script src="app.js"></script>
</body>
</html>
