<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSY3 - Adaptive Intelligence</title>
<style>
body{font-family:system-ui;background:#05080c;color:#eef;padding:20px;text-align:center}
h1{color:#d4ff3f;text-shadow:0 0 16px #d4ff3f}
#play{font-size:20px;padding:14px 44px;border-radius:14px;border:2px solid #d4ff3f;background:#131a10;color:#d4ff3f;cursor:pointer}
#play:hover{background:#d4ff3f;color:#000}
#status{color:#888;margin-top:10px}
#state{color:#d4ff3f;font-size:28px;margin-top:15px;font-weight:bold}
#energy-bar{width:300px;height:8px;background:#222;margin:10px auto;border-radius:4px;overflow:hidden}
#energy-fill{height:100%;background:linear-gradient(90deg,#d4ff3f,#ff6b35);width:0%;transition:width 0.3s}
#info{color:#666;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<h1>PSY3</h1>
<button id="play">PLAY &#9654;</button>
<p id="status">adaptive intelligence - no frames, pure flow</p>
<div id="state"></div>
<div id="energy-bar"><div id="energy-fill"></div></div>
<div id="info"></div>
<script>
"use strict";
const eng={ctx:null,
init(){if(this.ctx)return;const c=new(window.AudioContext||window.webkitAudioContext)();this.ctx=c;
this.sum=c.createGain();this.duck=c.createGain();this.comp=c.createDynamicsCompressor();
this.comp.threshold.value=-14;this.comp.ratio.value=2.5;
this.lim=c.createDynamicsCompressor();this.lim.threshold.value=-1.5;this.lim.ratio.value=20;
this.master=c.createGain();this.master.gain.value=0.9;
this.sum.connect(this.duck);this.duck.connect(this.comp);this.comp.connect(this.lim);this.lim.connect(this.master);this.master.connect(c.destination);
this.dSend=c.createGain();this.dl=c.createDelay(2);this.dl.delayTime.value=0.31;
this.df=c.createBiquadFilter();this.df.type="lowpass";this.df.frequency.value=3500;
this.fb=c.createGain();this.fb.gain.value=0.35;
this.dSend.connect(this.dl);this.dl.connect(this.df);this.df.connect(this.fb);this.fb.connect(this.dl);this.df.connect(this.sum);},
kick(t,a){a=a||1;const c=this.ctx,o=c.createOscillator(),g=c.createGain();
o.type="sine";o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(48,t+0.008);o.frequency.exponentialRampToValueAtTime(45,t+0.09);
g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
o.connect(g);g.connect(this.sum);o.start(t);o.stop(t+0.22);
const cl=c.createOscillator(),cg=c.createGain();cl.type="square";
cl.frequency.setValueAtTime(900,t);cl.frequency.exponentialRampToValueAtTime(200,t+0.012);
cg.gain.setValueAtTime(0.3*a,t);cg.gain.exponentialRampToValueAtTime(0.001,t+0.02);
cl.connect(cg);cg.connect(this.sum);cl.start(t);cl.stop(t+0.03);
if(this.duck){const d=this.duck.gain;d.cancelScheduledValues(t);d.setValueAtTime(0.5,t);d.setTargetAtTime(1,t+0.02,0.09);}},
bass(t,midi,dur,acid){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
o.type=acid?"sawtooth":"square";o.frequency.value=f;
fl.type="lowpass";fl.frequency.setValueAtTime(acid?2200:800,t);fl.frequency.exponentialRampToValueAtTime(acid?400:200,t+dur);fl.Q.value=acid?8:2;
g.gain.setValueAtTime(0.35,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
o.connect(fl);fl.connect(g);g.connect(this.sum);o.start(t);o.stop(t+dur+0.05);},
lead(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
o.type="sawtooth";o2.type="sawtooth";o.frequency.value=f;o2.frequency.value=f*1.005;
fl.type="lowpass";fl.frequency.setValueAtTime(3000,t);fl.frequency.exponentialRampToValueAtTime(800,t+dur);
g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(this.sum);g.connect(this.dSend);
o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);},
pad(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
o.type="sine";o.frequency.value=f;fl.type="lowpass";fl.frequency.value=1200;
g.gain.setValueAtTime(0.001,t);g.gain.linearRampToValueAtTime(0.08,t+dur*0.3);g.gain.linearRampToValueAtTime(0.001,t+dur);
o.connect(fl);fl.connect(g);g.connect(this.sum);g.connect(this.dSend);o.start(t);o.stop(t+dur+0.1);},
hat(t,open,v){v=v||0.15;const c=this.ctx,dur=open?0.15:0.04;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
const s=c.createBufferSource();s.buffer=buf;
const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=8000;
const g=c.createGain();g.gain.value=v;
s.connect(hp);hp.connect(g);g.connect(this.sum);s.start(t);},
clap(t){const c=this.ctx;
for(let i=0;i<3;i++){const dur=0.08;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);
for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
const s=c.createBufferSource();s.buffer=buf;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1500;bp.Q.value=1;
const g=c.createGain();g.gain.setValueAtTime(0.001,t+i*0.012);g.gain.exponentialRampToValueAtTime(0.3,t+i*0.012+dur);
s.connect(bp);bp.connect(g);g.connect(this.sum);s.start(t+i*0.012);s.stop(t+i*0.012+dur+0.1);}},
riser(t,dur){dur=dur||2;const c=this.ctx;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(i/d.length);
const s=c.createBufferSource();s.buffer=buf;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.Q.value=2;
bp.frequency.setValueAtTime(300,t);bp.frequency.exponentialRampToValueAtTime(6000,t+dur);
const g=c.createGain();g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.4,t+dur);
s.connect(bp);bp.connect(g);g.connect(this.sum);s.start(t);s.stop(t+dur+0.1);},
impact(t){const c=this.ctx,o=c.createOscillator();o.type="sine";
o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(35,t+0.4);
const g=c.createGain();g.gain.setValueAtTime(0.8,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
o.connect(g);g.connect(this.sum);o.start(t);o.stop(t+0.55);this.hat(t,true,0.2);}};

// === ADAPTIVE INTELLIGENCE ===
const SCALES={PHRY:[0,1,3,5,7,8,10]};

// States - not sections, but emotional states
const STATES={
CALM:{energy:0.2,density:0.3,complexity:0.2,color:'#4ecdc4'},
GROOVE:{energy:0.5,density:0.6,complexity:0.5,color:'#d4ff3f'},
TENSION:{energy:0.7,density:0.7,complexity:0.7,color:'#ff6b35'},
PEAK:{energy:1.0,density:1.0,complexity:1.0,color:'#ff2e63'},
RELEASE:{energy:0.3,density:0.4,complexity:0.3,color:'#a8e6cf'}};

// Probability matrix - likelihood of transitioning from state A to state B
const TRANSITIONS={
CALM:{CALM:0.2,GROOVE:0.5,TENSION:0.2,PEAK:0.0,RELEASE:0.1},
GROOVE:{CALM:0.1,GROOVE:0.3,TENSION:0.4,PEAK:0.1,RELEASE:0.1},
TENSION:{CALM:0.0,GROOVE:0.2,TENSION:0.2,PEAK:0.5,RELEASE:0.1},
PEAK:{CALM:0.0,GROOVE:0.1,TENSION:0.1,PEAK:0.3,RELEASE:0.5},
RELEASE:{CALM:0.5,GROOVE:0.3,TENSION:0.1,PEAK:0.0,RELEASE:0.1}};

const mind={
state:'CALM',
energy:0.2,
targetEnergy:0.2,
memory:[],
motif:[],
bar:0,
step:0,
lastTransition:0,
minBarsInState:4,

init(seed){
this.state='CALM';
this.energy=0.2;
this.targetEnergy=0.2;
this.memory=[];
this.motif=this.genMotif(seed);
this.bar=0;
this.step=0;
this.lastTransition=0;},

genMotif(seed){const m=[];let v=0;for(let i=0;i<32;i++){v=(v+seed+i*3)%7;m.push(v);}return m;},

evolveMotif(){for(let i=0;i<32;i++){if(Math.random()<0.12){this.motif[i]=(this.motif[i]+Math.floor(Math.random()*3)-1+7)%7;}}},

chooseNextState(){
// Don't transition too quickly
if(this.bar-this.lastTransition<this.minBarsInState)return this.state;

const probs=TRANSITIONS[this.state];
const r=Math.random();
let cum=0;
for(const[next,p]of Object.entries(probs)){
cum+=p;
if(r<cum){
// Memory check - don't repeat same state too often
const recent=this.memory.slice(-4);
const count=recent.filter(s=>s===next).length;
if(count>=2&&Math.random()<0.5)continue;
return next;}}
return this.state;},

transition(){
const next=this.chooseNextState();
if(next!==this.state){
this.memory.push(this.state);
if(this.memory.length>16)this.memory.shift();
this.state=next;
this.targetEnergy=STATES[next].energy;
this.lastTransition=this.bar;
if(next==='TENSION')eng.riser(eng.ctx.currentTime,2);
if(next==='PEAK')eng.impact(eng.ctx.currentTime);
}},

update(){
// Smooth energy transition
this.energy+=(this.targetEnergy-this.energy)*0.05;
// Evolve motif occasionally
if(this.bar%8===0)this.evolveMotif();
// Check for state transition every 2 bars
if(this.bar%2===0)this.transition();}};

const seq={playing:false,timer:null,next:0,si:0,bpm:142,
start(){eng.init();if(eng.ctx.state==='suspended')eng.ctx.resume();
if(this.playing)return;this.playing=true;this.si=0;
mind.init(7);
this.next=eng.ctx.currentTime+0.1;
this.timer=setInterval(()=>this.tick(),25);},
stop(){this.playing=false;clearInterval(this.timer);},
s16(){return 60/this.bpm/4;},
tick(){while(this.next<eng.ctx.currentTime+0.15){this.step(this.si,this.next);this.si=(this.si+1)%32;
if(this.si===0){mind.bar++;mind.update();}
this.next+=this.s16();}},
step(s,t){const st=STATES[mind.state];const sc=SCALES.PHRY;const root=45;
const e=mind.energy;
document.getElementById('state').textContent=mind.state;
document.getElementById('state').style.color=st.color;
document.getElementById('energy-fill').style.width=(e*100)+'%';
document.getElementById('info').textContent='energy: '+e.toFixed(2)+' | bar: '+mind.bar+' | state: '+mind.state;
// Kick - always present, intensity follows energy
if(s%4===0)eng.kick(t,0.3+e*0.7);
// Bass - density based on state
if(s%2===1&&Math.random()<st.density)eng.bass(t,root+sc[mind.motif[s]%sc.length]-12,this.s16()*0.8,s%8===7);
// Lead - complexity based on state
if(s%4===2&&Math.random()<st.complexity*e)eng.lead(t,root+12+sc[mind.motif[s]%sc.length],this.s16()*1.5*e);
// Pad - present in calm/release states
if(s===0&&(mind.state==='CALM'||mind.state==='RELEASE'))eng.pad(t,root+sc[mind.motif[0]%sc.length],this.s16()*16);
// Hats - follow energy
if(s%2===0&&Math.random()<0.3+e*0.7)eng.hat(t,s%8===6,0.08+e*0.12);
// Clap - groove states
if(s%8===4&&st.density>0.5)eng.clap(t);}};

function toggle(){
if(seq.playing){seq.stop();document.getElementById('play').textContent='PLAY \u25B6';document.getElementById('status').textContent='Stopped';}
else{seq.start();document.getElementById('play').textContent='\u25A0 STOP';document.getElementById('status').textContent='adaptive flow - no frames';}}
document.getElementById('play').addEventListener('click',toggle);
</script>
</body>
</html>
