sub.frequency.setValueAtTime(48,t);sub.frequency.exponentialRampToValueAtTime(40,t+.05);
subG.gain.setValueAtTime(0,t);subG.gain.linearRampToValueAtTime(.7+mind.energy*.25,t+.002);subG.gain.exponentialRampToValueAtTime(.001,t+.16);
sub.connect(subG);subG.connect(masterGain);sub.start(t);sub.stop(t+.18);
var body=c.createOscillator(),bodyG=c.createGain();body.type="sine";
body.frequency.setValueAtTime(150,t);body.frequency.exponentialRampToValueAtTime(48,t+.007);
bodyG.gain.setValueAtTime(0,t);bodyG.gain.linearRampToValueAtTime(.35+mind.energy*.2,t+.001);bodyG.gain.exponentialRampToValueAtTime(.001,t+.065);
body.connect(bodyG);bodyG.connect(masterGain);body.start(t);body.stop(t+.08);
var cs=c.createBufferSource();cs.buffer=window._clickBuf;
var chp=c.createBiquadFilter();chp.type="highpass";chp.frequency.value=4000;
var cg=c.createGain();cg.gain.setValueAtTime(.09,t);cg.gain.exponentialRampToValueAtTime(.001,t+.004);
cs.connect(chp);chp.connect(cg);cg.connect(masterGain);cs.start(t);
sub.onended=function(){sub.disconnect();subG.disconnect();body.disconnect();bodyG.disconnect();cs.disconnect();chp.disconnect();cg.disconnect();_activeVoices-=3;};
pump(t);
}
function playHat(t,lvl,open){
if(_activeVoices>=MAX_VOICES)return;_activeVoices++;
var c=audioCtx;var s=c.createBufferSource();s.buffer=noiseBuf;
var f=c.createBiquadFilter();f.type="highpass";f.frequency.value=open?6000:9000;
var g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(lvl,t+.001);g.gain.exponentialRampToValueAtTime(.001,t+(open?.15:.04));
s.connect(f);f.connect(g);g.connect(masterGain);s.start(t);s.stop(t+(open?.18:.06));
s.onended=function(){s.disconnect();f.disconnect();g.disconnect();_activeVoices--;};
}
function playBass(t,freq,v){
if(_activeVoices>=MAX_VOICES)return;_activeVoices+=2;
var c=audioCtx;var dur=(60/activePreset().bpm)*.25*.65;
var o=c.createOscillator();o.type=v.bassWave;o.frequency.value=freq;
var f=c.createBiquadFilter();f.type="lowpass";f.Q.value=v.bassQ+2;
f.frequency.setValueAtTime(v.bassCut*(.9+mind.energy*.4),t);
f.frequency.exponentialRampToValueAtTime(Math.max(120,v.bassCut*.3),t+dur*.55);
var g=c.createGain();var vel=.75+Math.random()*.15;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.002);g.gain.setValueAtTime(vel,t+dur*.6);g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(f);f.connect(g);g.connect(duckBus);
var so=c.createOscillator();so.type="sine";so.frequency.value=freq/2;
var sg=c.createGain();sg.gain.setValueAtTime(0,t);sg.gain.linearRampToValueAtTime(.3,t+.003);sg.gain.exponentialRampToValueAtTime(.001,t+dur*.8);
so.connect(sg);sg.connect(duckBus);
o.start(t);so.start(t);o.stop(t+dur+.02);so.stop(t+dur+.02);
o.onended=function(){o.disconnect();f.disconnect();g.disconnect();so.disconnect();sg.disconnect();_activeVoices-=2;};
}
function playLead(t,freq,v,accent,echo){
if(_activeVoices>=MAX_VOICES)return;_activeVoices+=2;
var c=audioCtx;var dur=accent?.22:.16;
var pan=c.createStereoPanner?c.createStereoPanner():null;
if(pan)pan.pan.value=(Math.random()*2-1)*(accent?.6:.35);
var o=c.createOscillator();o.type=v.leadWave;o.frequency.value=freq;
var o2=c.createOscillator();o2.type=v.leadWave;o2.frequency.value=freq;o2.detune.value=5;
var f=c.createBiquadFilter();f.type="lowpass";f.Q.value=accent?Math.min(14,v.leadQ+4):v.leadQ+2;
f.frequency.setValueAtTime(180,t);f.frequency.exponentialRampToValueAtTime(v.leadCut*(accent?1.25:1),t+.02);f.frequency.exponentialRampToValueAtTime(240,t+dur*.8);
var g=c.createGain();var peak=v.leadLvl*(accent?1:.65)*(.7+mind.energy*.3);
g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(f);o2.connect(f);f.connect(g);
if(pan){g.connect(pan);pan.connect(masterGain);}else{g.connect(masterGain);}
if(echo&&ppIn){g.connect(ppIn);}
if(window._revIn){g.connect(window._revIn);}
o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02);
o.onended=function(){o.disconnect();o2.disconnect();f.disconnect();g.disconnect();if(pan)pan.disconnect();_activeVoices-=2;};
}
function scheduler(){
while(nextNoteTime<audioCtx.currentTime+0.2){
scheduleStep(currentStep,nextNoteTime);
var spb=60/activePreset().bpm;
nextNoteTime+=.25*spb;
currentStep=(currentStep+1)%16;
if(currentStep===0){mind.bar++;mind.update();}
}
}
function scheduleStep(step,t){
var p=activePreset(),v=activeParams();
var lp=livePatterns||p.patterns;
var st=STATES[mind.state];
if(p.patterns.kick[step])playKick(t);
if(lp.hat[step]&&Math.random()<st.density+.3)playHat(t,v.hatLvl,(step===6||step===14));
var b=lp.bass[step];
if(b!==null&&b!==undefined&&Math.random()<st.density+.2)playBass(t,mtof(p.root+b),v);
var l=lp.lead[step];
if(l!==null&&l!==undefined&&Math.random()<st.complexity)playLead(t,mtof(p.root+24+l),v,step%4===0,true);
if(b===null&&step%4===2&&Math.random()<.15*st.density){var nb=lp.bass[(step+2)%16];if(nb!==null&&nb!==undefined)playBass(t,mtof(p.root+nb),v);}
stepQueue.push({step:step,time:t});
if(stepQueue.length>32)stepQueue.splice(0,stepQueue.length-32);
}
function startSeq(){
ensureAudio();
if(isPlaying)return;
isPlaying=true;currentStep=0;uiStep=-1;
mind.bar=0;mind.state="GROOVE";mind.energy=.5;mind.target=.5;mind.lastTrans=0;mind.memory=[];
initLivePatterns();
nextNoteTime=audioCtx.currentTime+.2;
schedulerTimer=makeTimer(25,scheduler);
$("playBtn").classList.add("playing");$("playBtn").textContent="\u25A0";
}
function stopSeq(){
isPlaying=false;
if(schedulerTimer){schedulerTimer.stop?schedulerTimer.stop():clearInterval(schedulerTimer);}
stepQueue.length=0;uiStep=-1;
$("playBtn").classList.remove("playing");$("playBtn").textContent="\u25B6";
renderSteps(-1);
}
var scope=$("scope"),sctx=scope.getContext("2d");
var lastW=0,lastH=0,_frameCount=0;
function sizeScopeIfChanged(){var w=scope.clientWidth*devicePixelRatio,h=scope.clientHeight*devicePixelRatio;if(w!==lastW||h!==lastH){lastW=w;lastH=h;scope.width=w;scope.height=h;}}
var _barColors=[];for(var bci=0;bci<32;bci++){_barColors.push("hsl("+(170+bci*2.2)+",100%,60%)");}
function drawScope(){
requestAnimationFrame(drawScope);
_frameCount++;if(_frameCount%3!==0)return;
if(!analyser)return;
sizeScopeIfChanged();
analyser.getByteFrequencyData(freqData);analyser.getByteTimeDomainData(waveData);
var W=scope.width,H=scope.height;sctx.clearRect(0,0,W,H);
var bars=32,bw=W/bars;
for(var i=0;i<bars;i++){var val=freqData[Math.floor(i*freqData.length/bars/1.6)]/255;var h=Math.max(2,val*H*.92);sctx.globalAlpha=.35+val*.65;sctx.fillStyle=_barColors[i]||"#0fc";sctx.fillRect(i*bw+1,H-h,bw-2,h);}
sctx.globalAlpha=1;sctx.strokeStyle="rgba(255,46,136,.8)";sctx.lineWidth=Math.max(1,devicePixelRatio);
sctx.beginPath();
var wp=0;for(var wi=0;wi<waveData.length;wi+=32){var wv=Math.abs(waveData[wi]-128);if(wv>wp)wp=wv;}
if(wp>3){for(var j=0;j<waveData.length;j+=8){var x=j/waveData.length*W,y=H*.5+(waveData[j]-128)/128*H*.3;j===0?sctx.moveTo(x,y):sctx.lineTo(x,y);}sctx.stroke();}
while(stepQueue.length&&stepQueue[0].time<=audioCtx.currentTime){var s=stepQueue.shift().step;if(s!==uiStep){uiStep=s;renderSteps(s);}}
}
var _prevDot=-1;
function renderSteps(on){
var dots=window._stepDots||(window._stepDots=document.querySelectorAll(".stepDot"));
var kick=activePreset().patterns.kick;
if(_prevDot>=0&&_prevDot<dots.length){dots[_prevDot].classList.remove("on");if(kick[_prevDot])dots[_prevDot].classList.add("kick");}
if(on>=0&&on<dots.length){dots[on].classList.add("on");dots[on].classList.remove("kick");}
_prevDot=on;
}
function buildPresets(){
var wrap=$("presetList");wrap.innerHTML="";
PRESETS.forEach(function(p){
var el=document.createElement("div");
el.className="presetCard"+(p.id===activePresetId?" sel":"");el.dataset.id=p.id;
el.innerHTML='<div class="pbpm">'+p.bpm+'</div><div class="pname">'+p.name+'</div><div class="ptag">'+p.tag+'</div><div class="pdesc">'+p.desc+'</div>';
el.addEventListener("click",function(){activePresetId=p.id;if(isPlaying)initLivePatterns();document.querySelectorAll(".presetCard").forEach(function(c){c.classList.toggle("sel",c.dataset.id===p.id);});refreshMeta();renderSteps(-1);});
wrap.appendChild(el);
});
}
function buildSteps(){var wrap=$("steps");wrap.innerHTML="";for(var i=0;i<16;i++){var d=document.createElement("div");d.className="stepDot";wrap.appendChild(d);}}
var KEYCHARS=["a","w","s","e","d","f","t","g","y","h","u","j","k"];
var BLACKS={1:1,3:1,6:1,8:1,10:1};
function buildPads(){var wrap=$("pads");wrap.innerHTML="";KEYCHARS.forEach(function(k,off){var b=document.createElement("button");b.type="button";b.className="pad"+(BLACKS[off%12]?" black":"");b.textContent=k;b.addEventListener("pointerdown",function(e){e.preventDefault();triggerPad(off,b);});wrap.appendChild(b);});}
function triggerPad(off,el){ensureAudio();playLead(audioCtx.currentTime,mtof(activePreset().root+24+off),activeParams(),true,true);if(el){el.classList.add("hit");setTimeout(function(){el.classList.remove("hit");},120);}}
window.addEventListener("keydown",function(e){if(e.repeat)return;var tag=(e.target.tagName||"").toLowerCase();if(tag==="input"||tag==="textarea")return;var idx=KEYCHARS.indexOf(e.key.toLowerCase());if(idx>=0){var pads=document.querySelectorAll(".pad");triggerPad(idx,pads[idx]);}if(e.key===" "){e.preventDefault();isPlaying?stopSeq():startSeq();}});
$("playBtn").addEventListener("click",function(){isPlaying?stopSeq():startSeq();});
$("vol").addEventListener("input",function(){if(masterGain)masterGain.gain.setTargetAtTime(parseFloat($("vol").value)*.75,audioCtx.currentTime,.05);});
document.querySelectorAll(".abToggle button").forEach(function(b){b.addEventListener("click",function(){activeVariant=b.dataset.v;document.querySelectorAll(".abToggle button").forEach(function(x){x.classList.toggle("on",x===b);});refreshMeta();});});
function refreshMeta(){var p=activePreset();$("nowName").textContent=p.name+" \u00B7 variant "+activeVariant;$("nowSub").textContent=p.bpm+" BPM \u00B7 root "+["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"][p.root%12]+(Math.floor(p.root/12)-1)+" \u00B7 16-step";}
var toastTimer=null;
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("show");},2600);}
document.addEventListener("visibilitychange",function(){if(!audioCtx)return;if(document.hidden){if(audioCtx.state==="running")audioCtx.suspend();if(isPlaying)stopSeq();}else{if(audioCtx.state==="suspended")audioCtx.resume();}});
buildPresets();buildSteps();buildPads();refreshMeta();
</script>
</body>
</html>
