<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSY3 - Pro Sound Engine</title>
<style>
body{font-family:system-ui;background:#05080c;color:#eef;padding:20px;text-align:center}
h1{color:#d4ff3f;text-shadow:0 0 16px #d4ff3f}
#play{font-size:20px;padding:14px 44px;border-radius:14px;border:2px solid #d4ff3f;background:#131a10;color:#d4ff3f;cursor:pointer}
#play:hover{background:#d4ff3f;color:#000}
#status{color:#888;margin-top:10px}
#state{color:#d4ff3f;font-size:28px;margin-top:15px;font-weight:bold}
#energy-bar{width:300px;height:8px;background:#222;margin:10px auto;border-radius:4px;overflow:hidden}
#energy-fill{height:100%;background:linear-gradient(90deg,#d4ff3f,#ff6b35);width:0%;transition:width 0.3s}
#info{color:#666;font-size:11px;margin-top:8px}
</style>
</head>
<body>
<h1>PSY3</h1>
<button id="play">PLAY &#9654;</button>
<p id="status">pro sound engine - adaptive intelligence</p>
<div id="state"></div>
<div id="energy-bar"><div id="energy-fill"></div></div>
<div id="info"></div>
<script>
"use strict";
const eng={ctx:null,
init(){if(this.ctx)return;const c=new(window.AudioContext||window.webkitAudioContext)();this.ctx=c;
this.sum=c.createGain();this.sum.gain.value=0.8;
this.duck=c.createGain();
this.comp=c.createDynamicsCompressor();this.comp.threshold.value=-18;this.comp.ratio.value=3;this.comp.attack.value=0.003;this.comp.release.value=0.15;
this.lim=c.createDynamicsCompressor();this.lim.threshold.value=-2;this.lim.ratio.value=20;this.lim.attack.value=0.001;this.lim.release.value=0.05;
this.master=c.createGain();this.master.gain.value=0.85;
this.sum.connect(this.duck);this.duck.connect(this.comp);this.comp.connect(this.lim);this.lim.connect(this.master);this.master.connect(c.destination);
this.dSend=c.createGain();this.dSend.gain.value=0.4;
this.dl=c.createDelay(2);this.dl.delayTime.value=0.31;
this.dlF=c.createBiquadFilter();this.dlF.type="lowpass";this.dlF.frequency.value=3500;
this.fb=c.createGain();this.fb.gain.value=0.35;
this.dSend.connect(this.dl);this.dl.connect(this.dlF);this.dlF.connect(this.fb);this.fb.connect(this.dl);this.dlF.connect(this.sum);
this.rSend=c.createGain();this.rSend.gain.value=0.3;
this.rev=c.createConvolver();
const ir=c.createBuffer(2,c.sampleRate*1.5,c.sampleRate);
for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<d.length;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.5);}}
this.rev.buffer=ir;
this.revG=c.createGain();this.revG.gain.value=0.25;
this.rSend.connect(this.rev);this.rev.connect(this.revG);this.revG.connect(this.sum);},
kick(t,a){a=a||1;const c=this.ctx;
// Sub layer - deep sine
const sub=c.createOscillator(),subG=c.createGain();
sub.type="sine";sub.frequency.setValueAtTime(55,t);sub.frequency.exponentialRampToValueAtTime(40,t+0.1);
subG.gain.setValueAtTime(0.9*a,t);subG.gain.exponentialRampToValueAtTime(0.001,t+0.25);
sub.connect(subG);subG.connect(this.sum);sub.start(t);sub.stop(t+0.3);
// Body layer - punch
const body=c.createOscillator(),bodyG=c.createGain();
body.type="sine";body.frequency.setValueAtTime(160,t);body.frequency.exponentialRampToValueAtTime(48,t+0.008);body.frequency.exponentialRampToValueAtTime(45,t+0.09);
bodyG.gain.setValueAtTime(0.7*a,t);bodyG.gain.exponentialRampToValueAtTime(0.001,t+0.18);
body.connect(bodyG);bodyG.connect(this.sum);body.start(t);body.stop(t+0.22);
// Click layer - transient
const click=c.createOscillator(),clickG=c.createGain();
click.type="square";click.frequency.setValueAtTime(900,t);click.frequency.exponentialRampToValueAtTime(200,t+0.012);
clickG.gain.setValueAtTime(0.25*a,t);clickG.gain.exponentialRampToValueAtTime(0.001,t+0.025);
click.connect(clickG);clickG.connect(this.sum);click.start(t);click.stop(t+0.035);
// Sidechain
if(this.duck){const d=this.duck.gain;d.cancelScheduledValues(t);d.setValueAtTime(0.4,t);d.setTargetAtTime(1,t+0.03,0.08);}},
bass(t,midi,dur,acid){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
// Main oscillator
const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
o.type=acid?"sawtooth":"square";o.frequency.value=f;
o2.type="sine";o2.frequency.value=f/2; // Sub octave
fl.type="lowpass";
fl.frequency.setValueAtTime(acid?2800:900,t);
fl.frequency.exponentialRampToValueAtTime(acid?350:180,t+dur);
fl.Q.value=acid?10:3;
g.gain.setValueAtTime(0.3,t);
g.gain.setValueAtTime(0.3,t+dur*0.7);
g.gain.exponentialRampToValueAtTime(0.001,t+dur);
o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(this.sum);
o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);},
lead(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),o2=c.createOscillator(),o3=c.createOscillator();
const g=c.createGain(),fl=c.createBiquadFilter();
o.type="sawtooth";o.frequency.value=f;
o2.type="sawtooth";o2.frequency.value=f*1.005;
o3.type="square";o3.frequency.value=f*0.998;
// Filter envelope
fl.type="lowpass";
fl.frequency.setValueAtTime(4000,t);
fl.frequency.exponentialRampToValueAtTime(600,t+dur);
fl.Q.value=4;
g.gain.setValueAtTime(0.12,t);
g.gain.setValueAtTime(0.12,t+dur*0.6);
g.gain.exponentialRampToValueAtTime(0.001,t+dur);
o.connect(fl);o2.connect(fl);o3.connect(fl);fl.connect(g);
g.connect(this.sum);g.connect(this.dSend);
o.start(t);o2.start(t);o3.start(t);
o.stop(t+dur+0.05);o2.stop(t+dur+0.05);o3.stop(t+dur+0.05);},
pad(t,midi,dur){const c=this.ctx,f=440*Math.pow(2,(midi-69)/12);
const o=c.createOscillator(),o2=c.createOscillator(),o3=c.createOscillator();
const g=c.createGain(),fl=c.createBiquadFilter();
o.type="sawtooth";o.frequency.value=f;
o2.type="sawtooth";o2.frequency.value=f*1.003;
o3.type="sawtooth";o3.frequency.value=f*0.997;
// Slow LFO on filter
const lfo=c.createOscillator(),lfoG=c.createGain();
lfo.type="sine";lfo.frequency.value=0.3;
lfoG.gain.value=300;
lfo.connect(lfoG);lfoG.connect(fl.frequency);
fl.type="lowpass";fl.frequency.value=1000;fl.Q.value=1;
g.gain.setValueAtTime(0.001,t);
g.gain.linearRampToValueAtTime(0.06,t+dur*0.4);
g.gain.setValueAtTime(0.06,t+dur*0.6);
g.gain.linearRampToValueAtTime(0.001,t+dur);
o.connect(fl);o2.connect(fl);o3.connect(fl);fl.connect(g);
g.connect(this.sum);g.connect(this.rSend);
o.start(t);o2.start(t);o3.start(t);lfo.start(t);
o.stop(t+dur+0.1);o2.stop(t+dur+0.1);o3.stop(t+dur+0.1);lfo.stop(t+dur+0.1);},
hat(t,open,v){v=v||0.15;const c=this.ctx,dur=open?0.18:0.045;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,open?1.5:3);
const s=c.createBufferSource();s.buffer=buf;
const hp=c.createBiquadFilter();hp.type="highpass";hp.frequency.value=open?7000:9000;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=12000;bp.Q.value=0.5;
const g=c.createGain();g.gain.value=v;
s.connect(hp);hp.connect(bp);bp.connect(g);g.connect(this.sum);s.start(t);},
clap(t){const c=this.ctx;
for(let i=0;i<4;i++){const dur=0.06;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);
for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
const s=c.createBufferSource();s.buffer=buf;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1200+i*200;bp.Q.value=1.5;
const g=c.createGain();
g.gain.setValueAtTime(0.001,t+i*0.011);
g.gain.exponentialRampToValueAtTime(0.25,t+i*0.011+dur);
s.connect(bp);bp.connect(g);g.connect(this.sum);g.connect(this.rSend);
s.start(t+i*0.011);s.stop(t+i*0.011+dur+0.1);}},
riser(t,dur){dur=dur||2;const c=this.ctx;
const buf=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(i/d.length);
const s=c.createBufferSource();s.buffer=buf;
const bp=c.createBiquadFilter();bp.type="bandpass";bp.Q.value=3;
bp.frequency.setValueAtTime(200,t);bp.frequency.exponentialRampToValueAtTime(8000,t+dur);
const g=c.createGain();g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.35,t+dur);
s.connect(bp);bp.connect(g);g.connect(this.sum);g.connect(this.rSend);
s.start(t);s.stop(t+dur+0.1);},
impact(t){const c=this.ctx;
// Deep impact
const o=c.createOscillator(),g=c.createGain();
o.type="sine";o.frequency.setValueAtTime(100,t);o.frequency.exponentialRampToValueAtTime(30,t+0.5);
g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.6);
o.connect(g);g.connect(this.sum);o.start(t);o.stop(t+0.65);
// Noise burst
const buf=c.createBuffer(1,c.sampleRate*0.1,c.sampleRate);const d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
const s=c.createBufferSource();s.buffer=buf;
const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2000;
const ng=c.createGain();ng.gain.value=0.4;
s.connect(lp);lp.connect(ng);ng.connect(this.sum);s.start(t);
this.hat(t,true,0.25);}};

// === ADAPTIVE INTELLIGENCE ===
const SCALES={PHRY:[0,1,3,5,7,8,10]};
const STATES={
CALM:{energy:0.2,density:0.3,complexity:0.2,color:'#4ecdc4'},
GROOVE:{energy:0.5,density:0.6,complexity:0.5,color:'#d4ff3f'},
TENSION:{energy:0.7,density:0.7,complexity:0.7,color:'#ff6b35'},
PEAK:{energy:1.0,density:1.0,complexity:1.0,color:'#ff2e63'},
RELEASE:{energy:0.3,density:0.4,complexity:0.3,color:'#a8e6cf'}};
const TRANSITIONS={
CALM:{CALM:0.2,GROOVE:0.5,TENSION:0.2,PEAK:0.0,RELEASE:0.1},
GROOVE:{CALM:0.1,GROOVE:0.3,TENSION:0.4,PEAK:0.1,RELEASE:0.1},
TENSION:{CALM:0.0,GROOVE:0.2,TENSION:0.2,PEAK:0.5,RELEASE:0.1},
PEAK:{CALM:0.0,GROOVE:0.1,TENSION:0.1,PEAK:0.3,RELEASE:0.5},
RELEASE:{CALM:0.5,GROOVE:0.3,TENSION:0.1,PEAK:0.0,RELEASE:0.1}};

const mind={state:'CALM',energy:0.2,targetEnergy:0.2,memory:[],motif:[],bar:0,lastTransition:0,minBarsInState:4,
init(seed){this.state='CALM';this.energy=0.2;this.targetEnergy=0.2;this.memory=[];this.motif=this.genMotif(seed);this.bar=0;this.lastTransition=0;},
genMotif(seed){const m=[];let v=0;for(let i=0;i<32;i++){v=(v+seed+i*3)%7;m.push(v);}return m;},
evolveMotif(){for(let i=0;i<32;i++){if(Math.random()<0.12){this.motif[i]=(this.motif[i]+Math.floor(Math.random()*3)-1+7)%7;}}},
chooseNextState(){
if(this.bar-this.lastTransition<this.minBarsInState)return this.state;
const probs=TRANSITIONS[this.state];const r=Math.random();let cum=0;
for(const[next,p]of Object.entries(probs)){cum+=p;
if(r<cum){const recent=this.memory.slice(-4);const count=recent.filter(s=>s===next).length;
if(count>=2&&Math.random()<0.5)continue;return next;}}
return this.state;},
transition(){const next=this.chooseNextState();
if(next!==this.state){this.memory.push(this.state);if(this.memory.length>16)this.memory.shift();
this.state=next;this.targetEnergy=STATES[next].energy;this.lastTransition=this.bar;
if(next==='TENSION')eng.riser(eng.ctx.currentTime,2);
if(next==='PEAK')eng.impact(eng.ctx.currentTime);}},
update(){this.energy+=(this.targetEnergy-this.energy)*0.05;
if(this.bar%8===0)this.evolveMotif();
if(this.bar%2===0)this.transition();}};

const seq={playing:false,timer:null,next:0,si:0,bpm:142,
start(){eng.init();if(eng.ctx.state==='suspended')eng.ctx.resume();
if(this.playing)return;this.playing=true;this.si=0;
mind.init(7);this.next=eng.ctx.currentTime+0.1;
this.timer=setInterval(()=>this.tick(),25);},
stop(){this.playing=false;clearInterval(this.timer);},
s16(){return 60/this.bpm/4;},
tick(){while(this.next<eng.ctx.currentTime+0.15){this.step(this.si,this.next);this.si=(this.si+1)%32;
if(this.si===0){mind.bar++;mind.update();}
this.next+=this.s16();}},
step(s,t){const st=STATES[mind.state];const sc=SCALES.PHRY;const root=45;const e=mind.energy;
document.getElementById('state').textContent=mind.state;
document.getElementById('state').style.color=st.color;
document.getElementById('energy-fill').style.width=(e*100)+'%';
document.getElementById('info').textContent='energy: '+e.toFixed(2)+' | bar: '+mind.bar+' | state: '+mind.state;
if(s%4===0)eng.kick(t,0.3+e*0.7);
if(s%2===1&&Math.random()<st.density)eng.bass(t,root+sc[mind.motif[s]%sc.length]-12,this.s16()*0.8,s%8===7);
if(s%4===2&&Math.random()<st.complexity*e)eng.lead(t,root+12+sc[mind.motif[s]%sc.length],this.s16()*1.5*e);
if(s===0&&(mind.state==='CALM'||mind.state==='RELEASE'))eng.pad(t,root+sc[mind.motif[0]%sc.length],this.s16()*16);
if(s%2===0&&Math.random()<0.3+e*0.7)eng.hat(t,s%8===6,0.08+e*0.12);
if(s%8===4&&st.density>0.5)eng.clap(t);}};

function toggle(){
if(seq.playing){seq.stop();document.getElementById('play').textContent='PLAY \u25B6';document.getElementById('status').textContent='Stopped';}
else{seq.start();document.getElementById('play').textContent='\u25A0 STOP';document.getElementById('status').textContent='adaptive flow - pro sounds';}}
document.getElementById('play').addEventListener('click',toggle);
</script>
</body>
</html>
