<script>
"use strict";

// ============================================================
// PSY3 COMPLETE REBUILD
// AudioWorklet + PolyBLEP + Moog Ladder + Voice Manager
// ============================================================

const BPM=143,STEP=60/BPM/4,DOT8=STEP*3,LOOKAHEAD=0.025;
const SCALE=[0,1,3,5,7,8,10]; // E Phrygian

// ============================================================
// AUDIOWORKLET PROCESSOR (runs in audio thread)
// ============================================================
const WORKLET_CODE = `
class PsySynth extends AudioWorkletProcessor {
  static get parameterDescriptors() { return []; }
  
  constructor() {
    super();
    this.NV = 12;
    this.voices = [];
    for (let i = 0; i < this.NV; i++) {
      this.voices.push({
        on: false, age: 0, noteId: -1,
        ph: 0, ph2: 0,
        freq: 110, amp: 0, tgtAmp: 0,
        wave: 0, cut: 1000, tgtCut: 1000,
        res: 0, drv: 1, det: 0,
        envSt: 0, envLv: 0,
        atk: 0.003, dec: 0.1, sus: 0.6, rel: 0.05,
        fs: [0,0,0,0]
      });
    }
    this.noteCtr = 0;
    this.port.onmessage = (e) => {
      const m = e.data;
      if (m.t === 'on') this.noteOn(m);
      else if (m.t === 'off') this.noteOff(m);
      else if (m.t === 'panic') this.panic();
    };
  }
  
  noteOn(m) {
    let v = null;
    for (let i = 0; i < this.NV; i++) {
      if (!this.voices[i].on) { v = this.voices[i]; break; }
    }
    if (!v) {
      let minA = 999;
      for (let i = 0; i < this.NV; i++) {
        if (this.voices[i].amp < minA) { minA = this.voices[i].amp; v = this.voices[i]; }
      }
      v.envSt = 3; v.rel = 0.001;
    }
    v.on = true; v.age = 0; v.noteId = this.noteCtr++;
    v.freq = m.f; v.tgtAmp = m.a; v.wave = m.w || 0;
    v.tgtCut = m.c || 1000; v.res = m.r || 0; v.drv = m.d || 1;
    v.det = m.dt || 0;
    v.atk = m.atk || 0.003; v.dec = m.dec || 0.1;
    v.sus = m.sus || 0.6; v.rel = m.rel || 0.05;
    v.envSt = 0; v.envLv = 0;
    v.ph = 0; v.ph2 = 0;
    v.fs = [0,0,0,0];
  }
  
  noteOff(m) {
    for (let i = 0; i < this.NV; i++) {
      if (this.voices[i].noteId === m.id && this.voices[i].on) {
        this.voices[i].envSt = 3;
        break;
      }
    }
  }
  
  panic() {
    for (let i = 0; i < this.NV; i++) {
      this.voices[i].envSt = 3;
      this.voices[i].rel = 0.001;
    }
  }
  
  polyblep(ph, dt) {
    if (ph < dt) { const p = ph/dt; return 2*p - p*p - 1; }
    if (ph > 1-dt) { const p = (ph-1)/dt; return p*p + 2*p + 1; }
    return 0;
  }
  
  process(inputs, outputs, params) {
    const out = outputs[0];
    if (!out || !out[0]) return true;
    const ch = out[0];
    const N = ch.length;
    const sr = sampleRate;
    
    for (let i = 0; i < N; i++) {
      let mix = 0;
      
      for (let vi = 0; vi < this.NV; vi++) {
        const v = this.voices[vi];
        if (!v.on) continue;
        v.age++;
        
        // Parameter smoothing (anti-zipper)
        v.amp += (v.tgtAmp - v.amp) * 0.008;
        v.cut += (v.tgtCut - v.cut) * 0.015;
        
        // Envelope (analog exponential curves)
        switch (v.envSt) {
          case 0: // attack
            v.envLv += (1 - v.envLv) * (1 - Math.exp(-1 / (v.atk * sr)));
            if (v.envLv >= 0.99) { v.envSt = 1; v.envLv = 1; }
            break;
          case 1: // decay
            v.envLv += (v.sus - v.envLv) * (1 - Math.exp(-1 / (v.dec * sr)));
            if (Math.abs(v.envLv - v.sus) < 0.002) v.envSt = 2;
            break;
          case 2: // sustain
            v.envLv = v.sus;
            break;
          case 3: // release
            v.envLv *= Math.exp(-1 / (v.rel * sr));
            if (v.envLv < 0.0005) { v.on = false; v.envLv = 0; }
            break;
        }
        if (!v.on) continue;
        
        // Oscillator 1 (PolyBLEP)
        const dt1 = v.freq / sr;
        v.ph += dt1;
        if (v.ph >= 1) v.ph -= 1;
        let x1;
        if (v.wave < 0.5) {
          x1 = 2*v.ph - 1 - this.polyblep(v.ph, dt1);
        } else if (v.wave < 1.5) {
          x1 = (v.ph < 0.5 ? 1 : -1) + this.polyblep(v.ph, dt1) - this.polyblep((v.ph+0.5)%1, dt1);
        } else if (v.wave < 2.5) {
          x1 = v.ph < 0.5 ? 4*v.ph-1 : 3-4*v.ph;
        } else {
          x1 = Math.sin(2*Math.PI*v.ph);
        }
        
        // Oscillator 2 (detuned)
        let x2 = 0;
        if (v.det !== 0) {
          const f2 = v.freq * (1 + v.det);
          const dt2 = f2 / sr;
          v.ph2 += dt2;
          if (v.ph2 >= 1) v.ph2 -= 1;
          x2 = 2*v.ph2 - 1 - this.polyblep(v.ph2, dt2);
        }
        
        let x = x1 + x2 * 0.7;
        
        // Drive (pre-filter analog saturation)
        x = Math.tanh(x * v.drv);
        
        // Moog Ladder Filter (4-pole, nonlinear, ZDF-style)
        const fc = Math.min(v.cut / (2*sr), 0.25);
        const p = fc * (1.8 - 0.8 * Math.pow(fc, 0.5));
        const k = 2 * Math.sin(Math.PI * fc);
        const rA = v.res / (1 + k * 0.5);
        const fb = v.fs[3] * rA;
        const inp = Math.tanh(x - fb);
        v.fs[0] += p * (inp - v.fs[0]);
        v.fs[1] += p * (Math.tanh(v.fs[0]*1.1) - v.fs[1]);
        v.fs[2] += p * (Math.tanh(v.fs[1]*1.1) - v.fs[2]);
        v.fs[3] += p * (Math.tanh(v.fs[2]*1.1) - v.fs[3]);
        
        mix += v.fs[3] * v.envLv * v.amp;
      }
      
      ch[i] = mix;
    }
    
    if (out.length > 1) out[1].set(ch);
    return true;
  }
}
registerProcessor('psy-synth', PsySynth);
`;

// ============================================================
// AUDIO CONTEXT
// ============================================================
let ctx=null, synthNode=null, master=null, duckBus=null;
let ppIn=null, revIn=null, analyser=null;
let unlocked=false, ready=false;

async function initAudio() {
    if (ctx && ctx.state !== 'closed') { try { await ctx.close(); } catch(e){} }
    ctx = new (window.AudioContext || window.webkitAudioContext)({
        latencyHint: 'interactive', sampleRate: 44100
    });
    if (ctx.state === 'suspended') { try { await ctx.resume(); } catch(e){} }
    
    // iOS unlock
    if (!unlocked) {
        try {
            const b = ctx.createBuffer(1,1,22050);
            const s = ctx.createBufferSource();
            s.buffer = b; s.connect(ctx.destination); s.start(0);
            unlocked = true;
        } catch(e){}
    }
    
    // Load AudioWorklet from Blob
    const blob = new Blob([WORKLET_CODE], {type:'application/javascript'});
    const url = URL.createObjectURL(blob);
    await ctx.audioWorklet.addModule(url);
    URL.revokeObjectURL(url);
    
    synthNode = new AudioWorkletNode(ctx, 'psy-synth', {
        numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2]
    });
    
    buildChain();
    ready = true;
}

function buildChain() {
    // Duck bus (pump)
    duckBus = ctx.createGain(); duckBus.gain.value = 0.65;
    
    // Master chain: sat → HP → EQ → comp → lim → out
    master = ctx.createGain(); master.gain.value = 0.6;
    
    const sat = ctx.createWaveShaper(); sat.oversample = '4x';
    const sc = new Float32Array(44100);
    for (let i=0;i<44100;i++){const x=(i*2)/44100-1;sc[i]=x>=0?Math.tanh(x*2.2):Math.tanh(x*1.4);}
    sat.curve = sc;
    
    const hp = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=28;
    const eq1 = ctx.createBiquadFilter(); eq1.type='peaking'; eq1.frequency.value=300; eq1.gain.value=-2; eq1.Q.value=1;
    const eq2 = ctx.createBiquadFilter(); eq2.type='highshelf'; eq2.frequency.value=8000; eq2.gain.value=2.5;
    
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-14; comp.ratio.value=3; comp.attack.value=0.008; comp.release.value=0.12;
    
    const lim = ctx.createDynamicsCompressor();
    lim.threshold.value=-1; lim.ratio.value=20; lim.attack.value=0.001; lim.release.value=0.05;
    
    const out = ctx.createGain(); out.gain.value=0.9;
    
    synthNode.connect(master);
    master.connect(sat); sat.connect(hp); hp.connect(eq1); eq1.connect(eq2);
    eq2.connect(comp); comp.connect(lim); lim.connect(out); out.connect(ctx.destination);
    
    analyser = ctx.createAnalyser(); analyser.fftSize=256;
    lim.connect(analyser);
    
    // Ping-pong delay
    ppIn = ctx.createGain(); ppIn.gain.value=0.25;
    const dlL=ctx.createDelay(2), dlR=ctx.createDelay(2);
    dlL.delayTime.value=DOT8; dlR.delayTime.value=DOT8;
    const fbL=ctx.createGain(), fbR=ctx.createGain();
    fbL.gain.value=0.3; fbR.gain.value=0.3;
    const flL=ctx.createBiquadFilter(), flR=ctx.createBiquadFilter();
    flL.type='lowpass'; flL.frequency.value=2200;
    flR.type='lowpass'; flR.frequency.value=2200;
    const pnL=ctx.createStereoPanner(), pnR=ctx.createStereoPanner();
    pnL.pan.value=-0.8; pnR.pan.value=0.8;
    ppIn.connect(dlL); dlL.connect(flL); flL.connect(fbL); fbL.connect(dlR);
    dlR.connect(flR); flR.connect(fbR); fbR.connect(dlL);
    dlL.connect(pnL); pnL.connect(master);
    dlR.connect(pnR); pnR.connect(master);
    
    // Reverb
    revIn = ctx.createGain(); revIn.gain.value=0.2;
    const conv = ctx.createConvolver();
    const sr=ctx.sampleRate, len=Math.floor(sr*1.5);
    const ir = ctx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);}
    conv.buffer=ir;
    const rg=ctx.createGain(); rg.gain.value=0.18;
    revIn.connect(conv); conv.connect(rg); rg.connect(master);
}

function pump(t) {
    const d = duckBus.gain;
    d.cancelScheduledValues(t);
    d.setValueAtTime(0.65,t);
    d.setTargetAtTime(0.2,t,0.008);
    d.setTargetAtTime(0.65,t+0.05,0.06);
}

// ============================================================
// NOTE TRIGGERS (via AudioWorklet postMessage)
// ============================================================
let noteId = 0;
const activeNotes = new Map();

function noteOn(freq, amp, opts={}) {
    const id = noteId++;
    synthNode.port.postMessage({
        t:'on', f:freq, a:amp, w:opts.w||0,
        c:opts.c||1000, r:opts.r||0, d:opts.d||1,
        dt:opts.dt||0,
        atk:opts.atk||0.003, dec:opts.dec||0.1,
        sus:opts.sus||0.6, rel:opts.rel||0.05
    });
    activeNotes.set(id, true);
    return id;
}

function noteOff(id) {
    synthNode.port.postMessage({t:'off', id:id});
    activeNotes.delete(id);
}

// Scheduled note (auto noteOff after duration)
function playNote(freq, amp, dur, opts={}) {
    const id = noteOn(freq, amp, opts);
    setTimeout(() => noteOff(id), dur * 1000);
    return id;
}

// ============================================================
// INSTRUMENTS
// ============================================================
const ROOT = 45; // E

function trigKick(t, vel) {
    // Sub: 41.2Hz sine (worklet voice)
    playNote(41.2, 0.85*vel, 0.16, {w:3, c:200, r:0, d:1.5, atk:0.002, dec:0.12, sus:0, rel:0.04});
    // Body: 150→48Hz (worklet voice with high cutoff)
    playNote(150, 0.5*vel, 0.09, {w:3, c:5000, r:0, d:1, atk:0.001, dec:0.07, sus:0, rel:0.02});
    // Click: noise burst (regular Web Audio)
    const c=ctx;
    const cb=c.createBuffer(1,Math.floor(c.sampleRate*0.004),c.sampleRate);
    const cd=cb.getChannelData(0);
    for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*(1-i/cd.length);
    const cs=c.createBufferSource(); cs.buffer=cb;
    const chp=c.createBiquadFilter(); chp.type='highpass'; chp.frequency.value=4000;
    const cg=c.createGain();
    cg.gain.setValueAtTime(0.07*vel,t);
    cg.gain.exponentialRampToValueAtTime(0.001,t+0.005);
    cs.connect(chp); chp.connect(cg); cg.connect(master);
    cs.start(t);
    cs.onended=()=>{cs.disconnect();chp.disconnect();cg.disconnect();};
    pump(t);
}

function trigBass(t, midi, vel) {
    const freq = 440*Math.pow(2,(midi-69)/12);
    const dur = STEP*0.65;
    // Main: saw, filter env 1400→200, Q=7, drive 1.8
    playNote(freq, vel, dur, {w:0, c:1400, r:7, d:1.8, atk:0.003, dec:dur*0.55, sus:0.3, rel:0.02});
    // Sub: sine, octave below
    playNote(freq/2, vel*0.35, dur*0.7, {w:3, c:300, r:0, d:1, atk:0.002, dec:dur*0.5, sus:0, rel:0.02});
}

function trigLead(t, midi, dur, vel) {
    const freq = 440*Math.pow(2,(midi-69)/12);
    // Main osc
    const id1 = playNote(freq, vel, dur, {w:0, c:5500, r:8, d:2, dt:0, atk:0.004, dec:0.2, sus:0.5, rel:0.1});
    // Detuned osc
    playNote(freq, vel*0.7, dur, {w:0, c:5500, r:8, d:2, dt:0.004, atk:0.004, dec:0.2, sus:0.5, rel:0.1});
}

function trigPad(t, midi, dur) {
    const freq = 440*Math.pow(2,(midi-69)/12);
    playNote(freq, 0.03, dur, {w:0, c:700, r:1, d:1, dt:-0.006, atk:0.5, dec:1, sus:0.8, rel:1});
    playNote(freq, 0.03, dur, {w:0, c:700, r:1, d:1, dt:0, atk:0.5, dec:1, sus:0.8, rel:1});
    playNote(freq, 0.03, dur, {w:0, c:700, r:1, d:1, dt:0.006, atk:0.5, dec:1, sus:0.8, rel:1});
}

function trigHat(t, open, vel) {
    const c=ctx, dur=open?0.15:0.035;
    const buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,open?2:4);
    const s=c.createBufferSource(); s.buffer=buf;
    const hp=c.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=9000;
    const g=c.createGain();
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vel,t+0.001);
    s.connect(hp); hp.connect(g); g.connect(master);
    s.start(t);
    s.onended=()=>{s.disconnect();hp.disconnect();g.disconnect();};
}

function trigClap(t) {
    const c=ctx;
    for(let i=0;i<3;i++){
        const dur=0.05;
        const buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
        const d=buf.getChannelData(0);
        for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
        const s=c.createBufferSource(); s.buffer=buf;
        const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1200+i*300; bp.Q.value=2;
        const g=c.createGain();
        g.gain.setValueAtTime(0.001,t+i*0.01);
        g.gain.exponentialRampToValueAtTime(0.15,t+i*0.01+dur);
        s.connect(bp); bp.connect(g); g.connect(master);
        s.start(t+i*0.01); s.stop(t+i*0.01+dur+0.05);
    }
}

function trigRiser(t, dur) {
    dur=dur||2;
    const c=ctx;
    const nb=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
    const nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const ns=c.createBufferSource(); ns.buffer=nb;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=4;
    bp.frequency.setValueAtTime(150,t);
    bp.frequency.exponentialRampToValueAtTime(9000,t+dur);
    const g=c.createGain();
    g.gain.setValueAtTime(0.001,t);
    g.gain.exponentialRampToValueAtTime(0.2,t+dur);
    ns.connect(bp); bp.connect(g); g.connect(master);
    ns.start(t); ns.stop(t+dur+0.1);
    ns.onended=()=>{ns.disconnect();bp.disconnect();g.disconnect();};
}

function trigImpact(t) {
    const c=ctx;
    playNote(85, 0.8, 0.55, {w:3, c:200, r:0, d:1, atk:0.001, dec:0.4, sus:0, rel:0.15});
    const nb=c.createBuffer(1,Math.floor(c.sampleRate*0.1),c.sampleRate);
    const nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);
    const ns=c.createBufferSource(); ns.buffer=nb;
    const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2500;
    const ng=c.createGain(); ng.gain.value=0.4;
    ns.connect(lp); lp.connect(ng); ng.connect(master);
    ns.start(t);
    ns.onended=()=>{ns.disconnect();lp.disconnect();ng.disconnect();};
}

// ============================================================
// ADAPTIVE MIND
// ============================================================
const STATES={
    CALM:{energy:.2,density:.3,complexity:.2,color:'#4ecdc4'},
    GROOVE:{energy:.5,density:.6,complexity:.5,color:'#d4ff3f'},
    TENSION:{energy:.7,density:.7,complexity:.7,color:'#ff6b35'},
    PEAK:{energy:1,density:1,complexity:1,color:'#ff2e63'},
    RELEASE:{energy:.3,density:.4,complexity:.3,color:'#a8e6cf'}
};
const TRANS={
    CALM:{CALM:.2,GROOVE:.5,TENSION:.2,PEAK:0,RELEASE:.1},
    GROOVE:{CALM:.1,GROOVE:.3,TENSION:.4,PEAK:.1,RELEASE:.1},
    TENSION:{CALM:0,GROOVE:.2,TENSION:.2,PEAK:.5,RELEASE:.1},
    PEAK:{CALM:0,GROOVE:.1,TENSION:.1,PEAK:.3,RELEASE:.5},
    RELEASE:{CALM:.5,GROOVE:.3,TENSION:.1,PEAK:0,RELEASE:.1}
};

const mind={
    state:'CALM',energy:.2,target:.2,memory:[],motif:[],bar:0,lastTrans:0,minBars:4,
    init(seed){
        this.state='CALM';this.energy=.2;this.target=.2;
        this.memory=[];this.bar=0;this.lastTrans=0;
        this.motif=[];let v=0;
        for(let i=0;i<32;i++){v=(v+seed+i*3)%7;this.motif.push(v);}
    },
    evolve(){
        const rate=.08+this.energy*.1;
        for(let i=0;i<32;i++){
            if(Math.random()<rate){
                const d=Math.floor(Math.random()*3)-1;
                this.motif[i]=(this.motif[i]+d+7)%7;
            }
        }
    },
    chooseNext(){
        if(this.bar-this.lastTrans<this.minBars)return this.state;
        const probs=TRANS[this.state];
        const r=Math.random();let cum=0;
        for(const[next,p]of Object.entries(probs)){
            cum+=p;
            if(r<cum){
                const recent=this.memory.slice(-4);
                if(recent.filter(s=>s===next).length>=2&&Math.random()<.5)continue;
                return next;
            }
        }
        return this.state;
    },
    transition(){
        const next=this.chooseNext();
        if(next!==this.state){
            this.memory.push(this.state);
            if(this.memory.length>16)this.memory.shift();
            this.state=next;
            this.target=STATES[next].energy;
            this.lastTrans=this.bar;
            if(next==='TENSION')trigRiser(ctx.currentTime,2);
            if(next==='PEAK')trigImpact(ctx.currentTime);
        }
    },
    update(){
        this.energy+=(this.target-this.energy)*.05;
        if(this.bar%8===0)this.evolve();
        if(this.bar%2===0)this.transition();
    }
};

// ============================================================
// WORKER TIMER
// ============================================================
const WORKER_SRC=`let iv=null;self.onmessage=function(e){if(e.data.cmd==='start'){if(iv)clearInterval(iv);iv=setInterval(()=>self.postMessage('tick'),e.data.ms);}else if(e.data.cmd==='stop'){if(iv)clearInterval(iv);iv=null;}};`;
function makeTimer(ms,onTick){
    try{
        const blob=new Blob([WORKER_SRC],{type:'application/javascript'});
        const w=new Worker(URL.createObjectURL(blob));
        w.onmessage=onTick;
        w.postMessage({cmd:'start',ms});
        return{stop:()=>{w.postMessage({cmd:'stop'});w.terminate();}};
    }catch(e){
        const iv=setInterval(onTick,ms);
        return{stop:()=>clearInterval(iv)};
    }
}

// ============================================================
// SEQUENCER
// ============================================================
const eng={running:false,step:0,next:0,timer:null,vuBuf:null};

function scheduleStep(s,t){
    const st=STATES[mind.state];
    const e=mind.energy;
    
    // Kick: 4-on-the-floor
    if(s%4===0)trigKick(t,0.4+e*0.6);
    
    // Bass: offbeat rolling
    if(s%2===1&&Math.random()<st.density)
        trigBass(t,ROOT+SCALE[mind.motif[s]%7]-12,0.28);
    
    // Lead: sparse, motif-driven
    if(s%4===2&&Math.random()<st.complexity*e*0.7)
        trigLead(t,ROOT+12+SCALE[mind.motif[s]%7],STEP*1.2,0.06);
    
    // Pad: CALM/RELEASE only
    if(s===0&&(mind.state==='CALM'||mind.state==='RELEASE'))
        trigPad(t,ROOT+SCALE[mind.motif[0]%7],STEP*16);
    
    // Hats
    if(s%2===0&&Math.random()<0.4+e*0.6)
        trigHat(t,s===6||s===14,0.06+e*0.08);
    
    // Clap
    if(s%8===4&&st.density>0.5)trigClap(t);
}

function tick(){
    if(!eng.running)return;
    while(eng.next<ctx.currentTime+LOOKAHEAD){
        scheduleStep(eng.step,eng.next);
        eng.step=(eng.step+1)%16;
        if(eng.step===0){mind.bar++;mind.update();}
        eng.next+=STEP;
    }
    updateUI();
}

function startEng(){
    eng.running=true;eng.step=0;
    eng.next=ctx.currentTime+0.05;
    mind.init(7);
    eng.timer=makeTimer(10,()=>tick());
}

function stopEng(){
    eng.running=false;
    if(eng.timer){eng.timer.stop();eng.timer=null;}
    if(synthNode)synthNode.port.postMessage({t:'panic'});
}

// ============================================================
// UI
// ============================================================
function updateUI(){
    const st=STATES[mind.state];
    const el=document.getElementById('state');
    el.textContent=mind.state;
    el.style.color=st.color;
    document.getElementById('ef').style.width=(mind.energy*100)+'%';
    document.getElementById('cf').style.width=((mind.energy*.5+.1)*100)+'%';
    if(analyser&&eng.vuBuf){
        analyser.getByteTimeDomainData(eng.vuBuf);
        let peak=0;
        for(let i=0;i<eng.vuBuf.length;i++){
            const v=Math.abs(eng.vuBuf[i]-128)/128;
            if(v>peak)peak=v;
        }
        document.getElementById('vf').style.width=(peak*100)+'%';
    }
    document.getElementById('info').textContent=
        'bar '+mind.bar+' | energy '+mind.energy.toFixed(2)+' | '+mind.state+
        ' | lat '+((ctx.baseLatency+ctx.outputLatency)*1000).toFixed(0)+'ms | worklet';
}

// ============================================================
// INIT
// ============================================================
document.getElementById('playBtn').addEventListener('click',async()=>{
    if(!ready)await initAudio();
    if(ctx.state!=='running'){
        document.getElementById('state').textContent='TAP AGAIN';
        return;
    }
    if(!eng.running){
        startEng();
        eng.vuBuf=new Uint8Array(analyser.frequencyBinCount);
        document.getElementById('playBtn').textContent='STOP';
        document.getElementById('playBtn').classList.add('active');
    }else{
        stopEng();
        document.getElementById('playBtn').textContent='PLAY';
        document.getElementById('playBtn').classList.remove('active');
        document.getElementById('state').textContent='STOPPED';
        document.getElementById('state').style.color='#5a6478';
        document.getElementById('vf').style.width='0%';
    }
});

['touchstart','touchend','mousedown'].forEach(ev=>{
    document.addEventListener(ev,async()=>{
        if(!ready)await initAudio();
    },{passive:true,once:true});
});

document.addEventListener('visibilitychange',()=>{
    if(!ctx)return;
    if(document.hidden){if(ctx.state==='running')ctx.suspend();stopEng();}
    else{if(ctx.state==='suspended')ctx.resume();}
});
</script>
